name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup show
      - name: Install pinned fuzz tools
        run: ./scripts/install-fuzz-tools.sh
      - name: Install repository linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libgmp10 \
            libmpfr6 \
            shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install pinned SMT differential oracles
        run: ./scripts/install-smt-oracles.sh
      - name: Repository CI gate
        run: ./scripts/ci.sh
        env:
          FUZZ_ARTIFACT_ROOT: ${{ runner.temp }}/fuzz-artifacts
      - name: Upload fuzz failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ github.sha }}
          path: ${{ runner.temp }}/fuzz-artifacts
          if-no-files-found: ignore

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Test minimum supported Rust
        run: ./scripts/check-msrv.sh
