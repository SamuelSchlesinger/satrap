name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup show
      - name: Repository CI gate
        run: ./scripts/ci.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Test minimum supported Rust
        run: ./scripts/check-msrv.sh
