name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  Z3_VERSION: "4.16.0"
  Z3_SHA256: "7288c49a5bd6dbafd7b0b0d1f65956b91672da24b08f09242919af159be3418e"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup show
      - name: Install repository linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install pinned Z3
        run: |
          archive="$RUNNER_TEMP/z3-${Z3_VERSION}.zip"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VERSION}/z3-${Z3_VERSION}-x64-glibc-2.39.zip"
          echo "${Z3_SHA256}  ${archive}" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/z3-${Z3_VERSION}-x64-glibc-2.39/bin" >> "$GITHUB_PATH"
      - name: Repository CI gate
        run: ./scripts/ci.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Test minimum supported Rust
        run: ./scripts/check-msrv.sh
