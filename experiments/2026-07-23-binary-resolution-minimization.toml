[experiment]
id = "2026-07-23-binary-resolution-minimization"
owner = "Codex"
status = "complete"
worktree_revision = "uncommitted initial worktree"

[hypothesis]
mechanism = "After ordinary recursive first-UIP minimization, an active binary clause containing the asserting literal can resolve away the complementary learned literal. Scanning only that asserting literal's packed watch list gives a cheap one-hop binary-implication-graph minimizer without another propagation pass."
prediction = "On the frozen development slice, one-hop binary resolution will remove at least one additional learned literal, preserve the two-second solved count, and avoid a greater-than-ten-percent repeated median regression on every nontrivial jointly solved development instance and both hard endpoints."
falsification = "Reject default promotion unchanged if no binary-resolution literal is removed, the two-second solved count falls, any repeated nontrivial jointly solved development case or hard endpoint regresses by more than ten percent, easy pooled overhead exceeds five percent, a SAT model is invalid, or an emitted UNSAT proof fails DRAT-trim. Do not tune eligibility or consume held-out data after outcomes are observed."

[prior_art]
checked = [
  "MapleCOMSPS_LRB core/Solver.cc binResMinimize, as preserved at https://github.com/hjwdzh/QuadriFlow/blob/master/3rd/MapleCOMSPS_LRB/core/Solver.cc",
  "Clause vivification by unit propagation in CDCL SAT solvers, Li et al., Artificial Intelligence 279 (2020), https://home.mis.u-picardie.fr/~cli/clauseVivificationPublishedVersion.pdf",
  "Minimizing Learned Clauses, Sörensson and Biere, SAT 2009",
  "CaDiCaL 3.0.1 src/minimize.cpp and Kissat 4.0.4 src/minimize.c at the pinned local revisions",
]
established = "Recursive implication-graph minimization and the additional one-hop binary-resolution pass on short low-LBD learned clauses are established SAT techniques."
distinction = "The existing solver already performs recursive reason-graph minimization. This experiment adds only the separate Glucose/Maple-style direct binary-resolution pass; it does not add transitive binary reachability, clause vivification, hyper-binary resolution, or repeated inprocessing."
novelty_status = "Baseline engineering only. No novelty claim."

[policy]
name = "one-hop asserting-literal binary-resolution minimization"
schedule = "Run after recursive learned-clause minimization and before backtrack-level selection for every first-UIP clause."
eligibility = "Only learned clauses of length 2 through 30 whose post-recursive-minimization LBD is at most 6."
marking = "Mark the variables in learned positions 1 onward for one epoch; the asserting literal at position 0 is never removable."
scan = "Traverse the current packed watch list of the asserting literal exactly once. Ignore deleted clauses and non-binary watches. For every active binary clause (asserting OR q), remove learned literal not-q if present. Deduplicate removals by clearing its epoch mark."
proof = "Log only the final learned clause. Resolving the first-UIP clause successively with the participating binary clauses preserves RUP; no proof deletion is needed."
reachability = "No transitive closure, recursive binary DFS, newly generated binary clauses, or retry after the first scan."
default = "disabled until the promotion gate passes"

[variants]
control = "target/release/sat --no-binary-minimize --no-subsume --no-vivify --no-probe"
treatment = "target/release/sat --binary-minimize --no-subsume --no-vivify --no-probe"
compiler = "rustc stable with -C target-cpu=native and release fat LTO"

[corpus]
manifest = "benchmarks/manifests/satcomp-2025-development.json"
role = "development"
deduplication = "sha256"
heldout_use = "none"

[protocol]
full_slice_timeout_seconds = 2
full_slice_repetitions = 1
jointly_solved_repetitions = 7
jointly_solved_selection = "After the frozen full-slice run, repeat every development instance that either variant solves and whose control or treatment wall time is at least 0.1 seconds. Apply the per-instance ceiling to each repeated median; do not select by treatment direction."
endpoint_instances = ["Break_12_50.xml.cnf", "6s268r_Iter94.cnf"]
endpoint_timeout_seconds = 25
endpoint_repetitions = 3
easy_overhead_repetitions = 11
threads = 1
order_seed = 20251001
primary_metric = "validated solved count on the frozen eight-instance development slice at two seconds"
secondary_metrics = [
  "eligible learned clauses",
  "binary watch entries inspected",
  "binary-resolution literals removed",
  "final learned literals and LBD",
  "deterministic conflicts",
  "paired wall time",
]
stopping_rule = "Implement the frozen policy once, run correctness and proof checks, then execute the declared development comparisons. Do not inspect held-out data or change the policy after observing results."

[correctness]
unit_tests = "Exercise one and multiple removals, both polarities, unit production, nonmatching complements, deleted and non-binary watches, duplicate binary reasons, and the size/LBD eligibility boundary."
differential = "Add binary-resolution minimization to deterministic brute-force differential testing and validate every SAT model against the original clauses."
unsat_proof = "Retain a proof whose search removes at least one literal by binary resolution and require independent DRAT-trim verification on a crafted case plus a real development UNSAT case if the mechanism triggers there."
storage = "Use an epoch-mark vector sized with the variable arrays; allocate no per-conflict set or graph."
disabled_overhead = "The disabled path is one configuration branch after recursive minimization and performs no mark or watch scan."

[promotion_gate]
development_solved_delta_minimum = 0
development_binary_literals_removed_minimum = 1
jointly_solved_max_regression_percent = 10
endpoint_max_regression_percent = 10
easy_overhead_max_percent = 5
proof_required_if_triggered = true
next_step = "If promoted, make the one-hop pass the default and separately preregister bounded transitive binary reachability. If rejected, retain the switch and move to another independently gated baseline gap such as physical arena compaction or variable elimination."

