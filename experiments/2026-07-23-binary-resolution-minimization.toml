summary = "The direct binary-resolution pass preserved the 3/8 two-second solved count, validated every SAT model, removed learned literals on real instances, passed both repeated jointly-solved cases, stayed below the easy-overhead ceiling, and emitted independently verified proofs. It improved 6s299 by 14.5 percent and moved gm24 by only 1.0 percent. It nevertheless failed both preregistered hard endpoints: 69 removals increased Break from 3.320 to 4.435 seconds, and 6,263 removals increased 6s268 from a 5.365-second control median to three 25-second timeouts."
conclusion = "Rejected unchanged as the default because both hard endpoints exceeded the frozen ten-percent regression ceiling. Retain --binary-minimize as a proof-checked baseline capability. This established one-hop Glucose/Maple mechanism is useful on 6s299 but catastrophically changes the deterministic 6s268 trajectory, raising conflicts from 78,479 to 484,878 in the completed direct run. Do not tune the length/LBD gate or inspect held-out data; move to a separately gated baseline gap."

