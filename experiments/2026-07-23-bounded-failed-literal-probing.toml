[experiment]
id = "2026-07-23-bounded-failed-literal-probing"
owner = "Codex"
status = "complete"
worktree_revision = "uncommitted initial worktree"

[hypothesis]
mechanism = "Before the first CDCL decision, temporarily assume literals and run ordinary watched-literal propagation. If an assumption conflicts, add its negation as a root-level RUP unit. Root units can collapse implication-heavy structure before search, while a fixed propagation budget bounds unsuccessful work."
prediction = "On the frozen eight-instance development slice, bounded failed-literal probing will preserve validated solved count at two seconds and reduce conflicts on at least one nontrivial solved instance without adding more than five percent median overhead on the smoke/easy set."
falsification = "Do not promote probing as the default if development solved count falls, no failed literal is found on the development endpoints, or repeated easy-case median overhead exceeds five percent. Record the implementation as an experimental baseline capability even if the default-promotion gate fails; do not tune the budget after seeing outcomes."

[prior_art]
checked = [
  "https://fmv.jku.at/papers/BiereJarvisaloKiesl-SAT-Handbook-2021-Preprocessing-Chapter-Manuscript.pdf",
  "https://www.cs.helsinki.fi/u/mjarvisa/papers/jarvisalo-korhonen.sat14.pdf",
  "CaDiCaL 3.0.1 src/probe.cpp at pinned local revision c607304d8d0e3f62b28c1dbf4e47e8811d115c06",
  "Kissat 4.0.4 src/probe.c and src/preprocess.c at pinned local revision 8af8e56cf016be5f7a1f9a854d48fc154ded5f77",
]
established = "Failed-literal probing is long-established preprocessing and inprocessing. Current CaDiCaL bounds probing by effort, focuses on roots of the binary implication graph, and can derive hyper-binary resolvents; current Kissat combines several stronger simplifiers in probing phases."
novelty_status = "Baseline engineering only. This experiment makes no novelty claim."

[policy]
name = "one-pass bounded root failed-literal probing"
schedule = "Run once after initial root propagation and before the first CDCL search decision."
candidates = "Visit every root-unassigned variable in ascending index order. Probe its saved phase first and the opposite phase second; skip the second polarity if the first probe derives a root assignment."
attempt = "Push one temporary decision level, enqueue the candidate without changing saved phases, run the ordinary full-clause propagator to completion, then backtrack to level zero without recording a best-phase snapshot."
failed = "If propagation conflicts, emit the negated assumption as a textual DRAT/RUP unit, enqueue it at level zero, and propagate all resulting root consequences. A root conflict ends preprocessing as UNSAT."
successful = "Discard the temporary assignment and implications. Do not learn implications or hyper-binary clauses in this first mechanism."
budget = "Stop before the next attempt once probing plus derived-root propagation has processed min(100000, 2 * declared_variables) trail literals. A started propagation is completed, so one attempt may cross the limit."
rounds = 1
default = "disabled until the promotion gate passes"

[variants]
control = "target/release/sat --no-probe"
treatment = "target/release/sat --probe"
compiler = "rustc stable with -C target-cpu=native and release fat LTO"

[corpus]
manifest = "benchmarks/manifests/satcomp-2025-development.json"
role = "development"
deduplication = "sha256"
heldout_use = "none"

[protocol]
full_slice_timeout_seconds = 2
full_slice_repetitions = 1
endpoint_timeout_seconds = 25
endpoint_repetitions = 3
easy_overhead_repetitions = 11
threads = 1
order_seed = 20250903
primary_metric = "validated solved count on the frozen eight-instance development slice at two seconds"
secondary_metrics = [
  "failed literal units",
  "probe attempts",
  "probing propagations",
  "deterministic search conflicts",
  "paired wall time",
]
stopping_rule = "Implement the frozen policy once, run correctness and proof checks, then execute the declared development comparisons. Do not inspect held-out data and do not change the 100000-propagation cap after observing results."

[correctness]
unit_tests = "Exercise successful probes, failed probes, both polarities, derived root contradiction, phase preservation, and budget termination."
differential = "Add probing to deterministic brute-force differential testing and validate every returned SAT model against the original formula."
unsat_proof = "Retain at least one proof containing a probe-derived unit and require independent DRAT-trim verification."
disabled_overhead = "The default disabled path performs only one configuration branch before search and adds no branch to ordinary propagation or enqueue."

[promotion_gate]
development_solved_delta_minimum = 0
development_failed_literals_minimum = 1
easy_overhead_max_percent = 5
proof_required = true
next_step = "If promoted, keep the simple mechanism as a baseline and separately preregister binary-root scheduling and hyper-binary resolution. If rejected, move to subsumption/vivification without tuning this result."

[results]
