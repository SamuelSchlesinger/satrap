full_slice_jsonl_sha256 = "d80e766b47790fc505c248374fa6ee94cb19cdabb722baf80010be6bef75f5d1"
endpoint_jsonl = "/private/tmp/sat-baselines-20260723/bounded-failed-literal-probing-endpoints-repeat3.jsonl"
endpoint_jsonl_sha256 = "0287dac91b97f0e88da7c0725bb91ce5dd484f6d1e67293ee069d38621d5804f"
easy_jsonl = "/private/tmp/sat-baselines-20260723/bounded-failed-literal-probing-easy-repeat11.jsonl"
easy_jsonl_sha256 = "5f8c16374a2c3fdfb34f77973f1f16a195c4c26d1e9deae2ede635e2a336fb3b"
summary = "The numeric minimum gates passed but the mechanism did not generalize. Both variants solved the same 3/8 development instances at two seconds and all SAT models validated. Probing improved Break_12_50 by 31.9 percent while deriving no units there, but regressed 6s268r_Iter94 by 44.7 percent after deriving 14 units and regressed gm24sparrc by more than 3x after deriving two units. Pooled smoke timing showed no detectable disabled-path overhead."
conclusion = "Rejected as the default and retained behind --probe as a proof-checked baseline capability. The intended unit-discovery mechanism was not responsible for the only hard-case gain: successful probes incidentally reordered watches on Break. Where units were found, the changed root state led to substantially worse deterministic search on both measured UNSAT cases. Do not tune this budget or consume held-out data; move to a separately preregistered subsumption or vivification mechanism."

