endpoint_jsonl = "/private/tmp/sat-baselines-20260723/bounded-root-vivification-endpoints-repeat3.jsonl"
endpoint_jsonl_sha256 = "c55448e8302b8561dd10f644ec3a371e64a763f5cfafb72ea08d976b071871fc"
easy_jsonl = "/private/tmp/sat-baselines-20260723/bounded-root-vivification-easy-repeat11.jsonl"
easy_jsonl_sha256 = "f0d2c0c75f5a425ecf02dc115731cb8debb9cb884849a62241d0ce3f518b270b"
summary = "Vivification preserved the 3/8 solved count and produced a striking proof-producing win on gm24sparrc, but failed the preregistered hard-family gate. It reduced gm24sparrc from 0.307 seconds and 147 search conflicts to 0.043 seconds and zero search conflicts by strengthening 24 clauses, removing 29 literals, and deriving five root units. It improved 6s268 by 8.8 percent, but one single-literal strengthening plus unsuccessful vivification watch perturbations made Break_12_50 about 3.98x slower."
conclusion = "Rejected unchanged as the default because Break_12_50 exceeded the preregistered ten-percent regression ceiling by a wide margin. Retain --vivify as a proof-checked baseline capability and retain the stable fresh-clause replacement machinery. Do not tune this schedule or inspect held-out data; move to separately preregistered occurrence-indexed subsumption/SSR."

