crafted_proof_sha256 = "0b3656acb6d108aec227d4fea92925a058ed8ef2f3be03210ac9fa1585d8110a"
real_proof = "/private/tmp/sat-baselines-20260723/bounded-variable-elimination-gm24.drat"
real_proof_sha256 = "d2e3f5a2ea5faec4f35d410cfa51a3fd70ef4b2e926f74c08dfb274ba2e36755"
summary = "The pass tied the control at 3/8 validated two-second development solves and eliminated variables on every inspected nontrivial case. Both retained UNSAT proofs passed DRAT-trim and every emitted SAT model was valid. It nevertheless missed the performance alternative: the pooled repeated median over gm24 and 6s299 regressed 8.21 percent, 6s299 alone regressed 15.46 percent, and Break_12_50 regressed 336.86 percent. The same fixed policy improved 6s268 by 29.33 percent, demonstrating a strong family interaction rather than a safe default."
conclusion = "Rejected unchanged as the default. Retain --eliminate as a proof-checked zero-growth BVE and model-extension baseline, but do not tune its bounds or selector on these revealed families. The next independent engineering gap is separate packed binary storage; any future selective, definition-aware, or repeated elimination policy requires a new preregistration and fresh evaluation data."

