[experiment]
id = "2026-07-23-clause-arena-compaction"
owner = "Codex"
status = "complete"
worktree_revision = "uncommitted initial worktree"

[hypothesis]
mechanism = "Database reduction leaves holes in the append-only literal arena. Packing the live suffix in stable clause-reference order immediately after each productive reduction should improve locality and bound logical arena growth without changing any search decision."
prediction = "The treatment will preserve the frozen two-second solved count and every deterministic search counter, reclaim at least one literal slot on a development instance, and improve the pooled repeated median of triggered nontrivial development cases by at least two percent without regressing any such case or hard endpoint by more than five percent."
falsification = "Reject default promotion unchanged if the two-second solved count falls, no development run compacts, any deterministic search counter or completed result differs, any SAT model is invalid, the control and treatment DRAT streams differ, pooled triggered-case improvement is below two percent, a nontrivial jointly solved development case or hard endpoint regresses by more than five percent, or easy pooled overhead exceeds five percent. Do not alter scheduling or inspect held-out data after outcomes are observed."

[prior_art]
checked = [
  "CaDiCaL 3.0.1 c60730422e758ef1cebe7aeddf2dda31c996bf04 src/collect.cpp copying garbage collector",
  "Kissat 4.0.4 8af8e56f174b778aef3aa45af9f739b2a5f492c2 src/reduce.c and src/collect.c sparse arena collection",
  "MiniSat 2.2 Solver::garbageCollect and relocAll copying collection",
]
established = "Copying or sliding garbage collection for learned-clause storage is established SAT-solver engineering. CaDiCaL additionally documents that preserving relative order already provides locality benefits, while Kissat collects arena garbage as part of reduction."
distinction = "This solver stores literals separately from stable clause metadata. The experiment can therefore slide only literal payloads in place and update metadata offsets; watches and reasons retain their ClauseRef values and require no relocation or rebuild."
novelty_status = "Baseline engineering only. No novelty claim."

[policy]
name = "reduction-synchronous stable-reference clause-arena compaction"
schedule = "Run once immediately after every learned-clause database reduction that newly deletes at least one arena-backed clause."
start = "Remember the minimum ClauseRef and arena offset among clauses newly deleted since the preceding compaction. Preserve the complete prefix before that offset."
order = "Visit metadata from the minimum newly deleted ClauseRef onward in stable ClauseRef order. Skip every deleted clause and copy each live clause's literal range downward with Vec::copy_within, preserving its literal order, then update only Clause.start."
reclamation = "Truncate the Vec to the final live write offset. Do not shrink capacity: later learned clauses reuse the allocation without an allocator round trip."
references = "Do not rewrite ClauseRef values in watch entries or reasons. Clause metadata objects remain at their original indices."
scope = "Collect original or learned payloads if another opt-in mechanism deleted them, but the frozen benchmark variants disable probing, vivification, subsumption, and binary-resolution minimization."
default = "disabled until the promotion gate passes"

[variants]
control = "target/release/sat --no-compact-arena --no-binary-minimize --no-subsume --no-vivify --no-probe"
treatment = "target/release/sat --compact-arena --no-binary-minimize --no-subsume --no-vivify --no-probe"
compiler = "rustc stable with -C target-cpu=native and release fat LTO"

[corpus]
manifest = "benchmarks/manifests/satcomp-2025-development.json"
role = "development"
deduplication = "sha256"
heldout_use = "none"

[protocol]
full_slice_timeout_seconds = 2
full_slice_repetitions = 1
jointly_solved_repetitions = 7
jointly_solved_selection = "After the frozen full-slice run, repeat every development instance that either variant solves and whose control or treatment wall time is at least 0.1 seconds. Apply the per-instance ceiling to every selected case. Compute the pooled treatment change from the sum of per-instance medians over only selected cases whose treatment reports at least one compaction."
endpoint_instances = ["Break_12_50.xml.cnf", "6s268r_Iter94.cnf"]
endpoint_timeout_seconds = 15
endpoint_repetitions = 3
easy_overhead_repetitions = 11
threads = 1
order_seed = 20251001
primary_metric = "validated solved count on the frozen eight-instance development slice at two seconds"
secondary_metrics = [
  "arena compactions",
  "literal slots moved and reclaimed",
  "peak and final logical arena length",
  "deterministic conflicts, decisions, propagations, restarts, learned clauses, learned literals, deletions, and reductions",
  "paired wall time",
]
stopping_rule = "Implement the frozen policy once, run structural and proof checks, then execute the declared development comparisons. Do not inspect held-out data or add a garbage-ratio threshold after observing results."

[correctness]
unit_tests = "Construct interleaved active and deleted clauses, compact from a nonzero prefix, and assert stable ClauseRefs, exact literal payloads, updated starts, unchanged watch/reason references, capacity retention, and idempotence when no new garbage exists."
differential = "Add arena compaction to deterministic brute-force differential testing and validate every SAT model against the original clauses."
trajectory = "For every completed paired benchmark, require identical status and deterministic search counters. Arena-only counters may differ."
unsat_proof = "On a real development UNSAT instance that triggers compaction, require byte-identical control and treatment DRAT streams and independent DRAT-trim verification."
disabled_overhead = "The disabled path adds one predictable configuration branch per clause deletion and after each reduction. It performs no garbage accounting, payload copy, metadata scan, or stats update."

[promotion_gate]
development_solved_delta_minimum = 0
development_reclaimed_literals_minimum = 1
deterministic_counter_mismatches_maximum = 0
triggered_pooled_improvement_percent_minimum = 2
jointly_solved_max_regression_percent = 5
endpoint_max_regression_percent = 5
easy_overhead_max_percent = 5
byte_identical_proof_required = true
next_step = "If promoted, make compaction the default and separately investigate clause ordering during collection. If rejected, retain the switch only if it remains correctness-useful, then move to proof-safe bounded variable elimination or separate packed binary storage."

