summary = "Compaction tied the control at 3/8 two-second development solves, validated every SAT model, preserved all inspected deterministic counters exactly, emitted a byte-identical independently verified proof, and stayed within every per-instance and easy-overhead ceiling. It reclaimed 14,145 literal slots on 6s299, 17,833,046 on Break, and 1,112,725 on 6s268. Runtime was nevertheless flat: the only jointly solved nontrivial case that triggered collection, 6s299, regressed 0.18 percent rather than improving by the required two percent."
conclusion = "Rejected unchanged as the default because it failed the preregistered triggered-case improvement floor. Retain --compact-arena as a proof-checked memory-growth control: it bounds logical arena growth and permits later clauses to reuse capacity, but the present reduction-synchronous stable-order pass does not improve runtime on the frozen development slice. Do not add a garbage threshold or inspect held-out data; move to a separately gated baseline gap."

