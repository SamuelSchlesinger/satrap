[boundary]
training_derived = true
statement = "The SAT Competition development corpus and every existing local held-out slice have already been revealed. They may falsify this mechanism and qualify it for a later new outcome-blind corpus, but they cannot establish generalization, novelty, priority, state-of-the-art performance, or a previously-unsolved claim."
heldout_use = "none"
default_promotion = "not authorized from this experiment"

[hypothesis]
mechanism = "Ordinary clause-management scores predict future utility from a clause's past or structure, while deletion removes the evidence needed to tell whether that prediction was wrong. Keep a tiny deterministic subset of clauses selected for deletion attached as noncausal shadows. A shadow updates its watches but never propagates or conflicts. If it becomes unit or false under the actual subsequent search, that is exact counterfactual evidence that the deleted clause would have been used. Delayed root-boundary reactivation lets the next epoch benefit from that evidence without contaminating the epoch that measured it."
prediction = "At least one shadow clause will generate a real would-propagate or would-conflict event and be reactivated. The treatment will preserve the promoted solver's 5/8 two-second development coverage and either add a solve or improve the repeated sum of jointly solved per-instance medians by at least five percent, while staying within the frozen per-case, endpoint, easy-overhead, correctness, and determinism ceilings."
falsification = "Reject the frozen treatment if no shadow triggers; no clause is reactivated; development coverage falls; it neither adds a development solve nor improves the qualifying repeated aggregate by five percent; any repeated development or endpoint case regresses more than twenty percent; easy overhead exceeds five percent; observation changes the logical search before a scheduled reactivation; or any model, proof, differential, watch-invariant, metadata, accounting, or determinism check fails. Do not tune capacity, horizon, rank, trigger semantics, delayed activation, restored score, reducer, schedule, or thresholds after observing results."

[prior_art]
freezing = "Audemard, Lagniez, Mazure, and Sais, On Freezing and Reactivating Learnt Clauses, SAT 2011, pages 188-200, https://doi.org/10.1007/978-3-642-21581-0_14"
freezing_mechanism = "That work detaches learned clauses and reactivates them from a progress-saving polarity measure. Freezing, reactivation, phase-based relevance, and active/frozen/dead clause states are established."
triggered_import = "Prevot, Soos, and Meel, Leveraging GPUs for Effective Clause Sharing in Parallel SAT Solving, SAT 2021, https://arxiv.org/abs/2012.03119"
triggered_import_mechanism = "GpuShareSat tests absent remote clauses against assignment snapshots and imports a clause that would have propagated or conflicted. The counterfactual trigger predicate and its recent-utility motivation are established."
prioritized_propagation = "Fleury and Schidler, Prioritised Unit Propagation by Partitioning the Watch Lists, Pragmatics of SAT 2023, https://ceur-ws.org/Vol-3545/paper2.pdf"
duplicate_retention = "Kochemazov et al., Speeding Up CDCL Inference with Duplicate Learnt Clauses, ECAI 2020, https://doi.org/10.3233/FAIA200111"
causal_analysis = "Yang, Shaw, Baluta, Soos, and Meel, Explaining SAT Solving Using Causal Reasoning, SAT 2023, https://doi.org/10.4230/LIPIcs.SAT.2023.28"
usage_control = "Cai, Zhang, Shi, Tao, and Xu, Rethinking Clause Management for CDCL SAT Solvers, arXiv:2602.20829v2, https://arxiv.org/pdf/2602.20829"
established = "Clause freezing/reactivation, phase-based relevance, active/inactive propagation partitions, duplicate-relearned-clause protection, offline causal utility analysis, recent-use retention, and would-propagate/would-conflict tests for remote clause import are established and are not claimed here."
distinction = "The proposed treatment neither predicts reactivation from phase, imports another worker's clause, permanently stores duplicates, changes propagation priority, nor estimates effects offline. It takes clauses that this same sequential solver has just selected for deletion, observes a bounded deterministic subset inline under the solver's exact future assignments while preventing those clauses from influencing that observation epoch, and feeds a real trigger back only after a delayed root boundary. A targeted primary-source and pinned-source search found no exact collision for this local deletion-regret loop."
novelty_status = "Provisional candidate contribution only. The ingredients have close prior art and their combination may be obvious or implemented elsewhere. No novelty or priority claim is authorized without a broader scholarly and solver-source audit plus successful untouched evaluation."

[policy]
name = "counterfactual shadow-clause reactivation"
flag = "--shadow-reactivation"
disable_flag = "--no-shadow-reactivation"
default = "disabled"
requires = "the promoted LBD-free clause-management policy, root restarts, and ordinary search propagation"
incompatible = "--scan-debt-reduction, --nonregular-retention, and any non-root trail-reuse policy"
capacity = 64
minimum_observation_conflicts = 256
selection = "At each LBD-free reduction, first compute the exact promoted locks, positive-score protections, zero-score deletion order, schedule, and quota. Among clauses the control would delete, fill unused shadow capacity with the lowest deterministic ranks; every unselected clause is deleted exactly as in the control. Rank clause reference c in one-indexed reduction r by SplitMix64(c xor (r shifted left 32)), breaking ties by c. A shadow leaves the active database and active-learned count immediately, so the active deletion quota is unchanged."
accounting = "Shadow clauses are ineligible for later reductions and cannot be locked because they never become reasons. active_learned_clauses decreases when a clause is shadowed and increases only on reactivation. The existing deleted_clauses counter continues to count permanent deletion: it increments immediately for ordinary deletions and only at expiry for an untriggered shadow. New effective_removals and reactivations counters expose the active-database transitions without redefining the legacy statistic."
storage = "Only when enabled, allocate one u8 state and one u64 start-conflict entry aligned with each long ClauseRef plus a vector of at most 64 current shadow references. Learned binaries are permanent and ineligible. Do not expand Clause, binary storage, Watch, reason, or literal records."
states = "A long clause is active, observing-shadow, triggered-shadow, or deleted. The optional side state is authoritative; the existing deleted bit remains false for both shadow states so their ordinary watch entries survive."
observation = "During ordinary search BCP only, process an observing or triggered shadow's two watches exactly as an active long clause would: blocker test, other-watch test, replacement scan, and stable watch movement. It never enqueues a literal, returns a conflict, becomes a reason, increments clause usage or activity, participates in conflict analysis, or changes any branching/restart statistic. On the first state with every literal false, mark conflict-triggered; on the first state with exactly one unassigned literal and all others false, mark unit-triggered. A triggered shadow continues maintaining its watches but further events do not change policy."
noncausality = "Until reactivation, shadow processing may consume time and move only that clause's watches, but it must not change assignments, active-clause relative watch order, decisions, propagations, conflicts, learned clauses, restarts, reductions, or any pre-existing deterministic counter."
lifetime = "A shadow becomes eligible for finalization only after at least 256 subsequent analyzed conflicts. Finalize all eligible shadows at the first later restart that backtracks to level zero. A root restart before the horizon leaves them shadowed. If the solver finishes first, shadows never affect its logical result."
finalization = "At an eligible root boundary, permanently delete every untriggered shadow. Reactivate every triggered shadow, restore its active-learned count, and set its promoted usage score to exactly one. Scan each reactivated clause under the root assignment before the next decision: enqueue a root unit with that clause as reason, record a deferred root conflict if false, and otherwise leave its maintained watches attached. Complete ordinary root propagation before selecting another decision."
proof = "Shadowing and reactivation do not change the formula: every shadow is an already logged RUP learned clause, and the current textual DRAT writer emits no deletion steps. Therefore no proof record is needed for either state transition. If proof deletion logging is introduced later, reactivation must first re-add the clause as RUP."
quota = "At a fixed reduction state, active clauses removed from propagation equal the promoted control's exact deletion count. Shadow capacity changes only whether up to 64 of those inactive clauses retain noncausal observation metadata and may return in a later epoch."
diagnostics = "Report clauses shadowed, active shadow peak, shadow watch visits, shadow literal checks, unit triggers, conflict triggers, reactivated clauses, expired untriggered clauses, root units, root conflicts, capacity skips, and conflicts from selection to finalization."
everything_else = "Keep the promoted usage-score initialization and increments, 2048-conflict decay, reduction schedule and fractions, EVSIDS, Luby root restarts, chronological backtracking, phase saving, proof logging, model reconstruction, minimization, propagation, preprocessing defaults, and every unrelated policy unchanged."

