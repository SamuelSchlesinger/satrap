[results]
summary = "Rejected unchanged. Counterfactual observation worked and gave exact noncausal evidence, but delayed reactivation was harmful on the only development family where it affected search. Treatment lost the two-second Break_12_50 solve, regressed the repeated jointly solved aggregate 11.418580 percent, regressed gm24 28.787681 percent from observation overhead alone, and regressed the Break endpoint 250.078711 percent after five reactivations drove conflicts from 37717 to 100740. Easy overhead was only 0.649638 percent, every emitted SAT model validated, the disabled path was exact, deterministic counters repeated exactly, and an exercised pigeonhole proof independently verified. The designated proof gate still failed because neither completed UNSAT development instance exercised a trigger and reactivation."
conclusion = "Do not promote, tune, or evaluate this frozen shadow policy on another revealed corpus. Preserve the implementation behind --shadow-reactivation as a negative causal diagnostic: the experiment shows that would-propagate evidence is real but is not by itself evidence that restoring the clause improves the future search."

