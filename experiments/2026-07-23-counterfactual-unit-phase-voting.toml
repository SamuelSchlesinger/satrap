[results]
summary = "Rejected unchanged. Treatment coverage fell from 5/8 to 4/8 at two seconds, losing Break_12_50 only to observer overhead: its endpoint search trajectory was exact and its treatment median regressed 5.247166 percent. The four jointly solved repeated medians all regressed and their sum rose 4.693941 percent. Easy overhead was 1.384741 percent. Most importantly, no completed development case produced a unit vote or phase write. Break scanned 768 sampled deletions, classifying 677 satisfied and 91 open; 6s268 scanned 128, classifying 2 satisfied and 126 open. The root-restart snapshot therefore missed the transient would-unit events that inline shadow observation had previously exposed."
conclusion = "Do not promote, tune, or evaluate this frozen phase-voting policy on another revealed corpus. Preserve the implementation behind --counterfactual-phase as a low-overhead negative diagnostic. Detaching sampled deletions and scanning them only at conflict-triggered root restarts repairs the shadow observer's hot-path cost and preserves exact control trajectories, but the boundary is too coarse to observe the signal. A successor must ask a different counterfactual question or capture transient evidence without restoring clauses and without branching in ordinary BCP."

