[boundary]
training_derived = true
statement = "The SAT Competition development corpus and every existing local held-out slice have already been revealed. They may falsify this mechanism and qualify it for a later new outcome-blind corpus, but they cannot establish generalization, novelty, priority, state-of-the-art performance, or a previously-unsolved claim."
heldout_use = "none"
default_promotion = "not authorized from this experiment"

[hypothesis]
mechanism = "A learned clause selected for deletion may later be unit under the search state reached without it. Restoring such clauses was harmful in the frozen shadow-reactivation experiment, but the unique would-be propagated literal is still a constraint-directed polarity observation. At an already-scheduled root restart, inspect a bounded priority sample of clauses that the promoted control actually deleted. Unanimous would-unit votes update saved phases after the root backtrack without restoring any clause. This may preserve useful directional information while retaining the control's propagation database and avoiding an observer branch in ordinary BCP."
prediction = "At least one sampled deleted clause will be unit at a pre-restart snapshot and produce an effective saved-phase change on a nontrivial real instance. The treatment will preserve the promoted solver's 5/8 two-second development coverage and either add a solve or improve the repeated sum of jointly solved per-instance medians by at least five percent, while staying within the frozen per-case, endpoint, easy-overhead, correctness, and determinism ceilings."
falsification = "Reject the frozen treatment if no deleted clause is sampled; no sampled clause is unit at a restart snapshot; no effective phase change occurs; development coverage falls; it neither adds a development solve nor improves the qualifying repeated aggregate by five percent; any repeated development or endpoint case regresses more than twenty percent; easy overhead exceeds five percent; deletion sampling changes the logical search before the first phase application; or any model, proof, differential, accounting, reference-stability, or determinism check fails. Do not tune capacity, rank, snapshot timing, vote aggregation, phase application, reducer, schedule, or thresholds after observing results."

