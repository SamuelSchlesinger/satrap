phase_saving = "Pipatsrisawat and Darwiche, A Lightweight Component Caching Scheme for Satisfiability Solvers, SAT 2007, https://doi.org/10.1007/978-3-540-72788-0_20"
dynamic_phase = "Chen, A Dynamic Phase Selection Strategy for Satisfiability Solvers, 2012, https://arxiv.org/abs/1208.1613"
dynamic_phase_mechanism = "Chen computes phase preferences from literals implied by trial BCP. Propagation-informed phase selection and implication-weighted polarity are established."
lsids = "Shaw and Meel, Designing New Phase Selection Heuristics, SAT 2020, https://arxiv.org/abs/2005.04850"
lsids_mechanism = "DPS and LSIDS use recent assignments, learned-clause literals, additive bumping, and decay to choose polarity. Literal-history and learned-clause-informed phase scores are established."
freezing = "Audemard, Lagniez, Mazure, and Sais, On Freezing and Reactivating Learnt Clauses, SAT 2011, pages 188-200, https://doi.org/10.1007/978-3-642-21581-0_14"
triggered_import = "Prevot, Soos, and Meel, Leveraging GPUs for Effective Clause Sharing in Parallel SAT Solving, SAT 2021, https://arxiv.org/abs/2012.03119"
triggered_import_mechanism = "GpuShareSat tests absent remote clauses against assignment snapshots and imports clauses that would propagate or conflict. Snapshot would-unit and would-conflict tests are established."
deletion_branching = "Wang, Xu, and Wu, Branching Heuristic Strategy Based on Learnt Clauses Deletion Strategy for SAT Solver, Computer Science 48(11), 2021, https://doi.org/10.11896/jsjkx.201000142"
deletion_branching_mechanism = "VDALCD reduces activities of variables occurring in a learned clause when that clause is deleted. Feeding deletion events into branching scores is established."
causal_analysis = "Yang, Shaw, Baluta, Soos, and Meel, Explaining SAT Solving Using Causal Reasoning, SAT 2023, https://doi.org/10.4230/LIPIcs.SAT.2023.28"
established = "Phase saving, implication-weighted phase selection, literal polarity scores, learned-clause-informed polarity, clause freezing/reactivation, snapshot would-propagate tests, deletion-conditioned variable activity, and offline causal utility analysis are established and are not claimed here."
distinction = "The proposed treatment performs no trial BCP, does not score all literals or variables, does not restore or import a clause, and does not alter variable priority. It takes a bounded deterministic priority sample only from this sequential solver's actual control-selected deletions, leaves those clauses deleted, tests their exact status only under the actual pre-restart assignment, aggregates unique would-unit literals by variable, and writes only unanimous polarities after the existing root backtrack. A targeted primary-source search found no exact collision for this deletion-regret-to-phase loop."
novelty_status = "Provisional candidate contribution only. The ingredients have close prior art and their combination may be obvious or implemented elsewhere. No novelty or priority claim is authorized without a broader scholarly and solver-source audit plus successful untouched evaluation."

[policy]
name = "counterfactual unit phase voting"
flag = "--counterfactual-phase"
disable_flag = "--no-counterfactual-phase"
default = "disabled"
requires = "the promoted LBD-free clause-management policy, stable long-clause references, root restarts, and phase saving"
incompatible = "--scan-debt-reduction, --nonregular-retention, --shadow-reactivation, --compact-arena, any non-root trail-reuse policy, and systematic rephasing in the declared comparison"
capacity = 64
selection = "At each LBD-free reduction, first compute the exact promoted locks, positive-score protections, zero-score deletion order, schedule, and quota. Every control-selected clause is permanently deleted immediately and active-learned accounting changes exactly as in the control. Offer each such long ClauseRef to a deterministic priority reservoir spanning the interval until the next root restart. Rank clause reference c in one-indexed reduction r by SplitMix64(c xor (r shifted left 32)), breaking ties by r and c. Retain the 64 lexicographically lowest rank tuples seen in that interval; replacement changes only the observer reservoir."
storage = "Only when enabled, allocate a vector of at most 64 records containing rank, reduction, and a stable reference to an already-deleted long clause. Do not copy clause literals and do not expand Clause, binary storage, Watch, reason, literal, variable, or per-clause side records. Physical arena compaction is incompatible because it may invalidate or remove sampled references."
snapshot = "When an existing restart will backtrack to level zero, but before canceling the current assignment, take the current reservoir and scan each sampled deleted clause once. Classify it as satisfied if any literal is true, open if no literal is true and at least two are unassigned, unit if exactly one is unassigned and all others are false, or conflict if all literals are false. A unit clause contributes its unique unassigned literal as one polarity vote. The scan cannot enqueue, conflict, become a reason, change activity, change clause usage, or alter any pre-existing search statistic."
aggregation = "Sort unit votes by variable. If all votes for a variable have the same polarity, retain one unanimous suggestion; if both polarities occur, record a disagreement and retain no suggestion. Vote multiplicity does not weight or rank variables."
application = "After the ordinary restart backtracks to level zero, write each unanimous suggestion into the existing saved-phase entry only if that variable is root-unassigned. Count both writes and effective changes from the prior saved phase. The normal search may overwrite that saved phase on any later assignment. Do not change variable order, activity, restart timing, decision count, propagation, or the formula."
lifetime = "Every sample is one-shot: it is discarded after the first subsequent root-restart snapshot whether satisfied, open, unit, or conflicting. If the solver finishes before another restart, the sample never affects search. A new interval starts with an empty reservoir."
noncausality = "Before the post-backtrack phase writes, sampling retains only references to clauses already deleted by the control and scans them read-only at an existing boundary. Therefore it may consume time and update new diagnostics but must not change assignments, active watch order, decisions, propagations, conflicts, learned clauses, restarts, reductions, deletions, or any pre-existing deterministic counter."
proof = "The treatment never changes the formula or proof log: sampled clauses remain deleted and phase choice affects only search order. Existing DRAT emission is therefore sufficient. Independently verify a treatment UNSAT proof against the original CNF."
diagnostics = "Report deletion offers, reservoir insertions, replacements, peak and live samples, snapshots, sampled clauses scanned, literal checks, satisfied/open/unit/conflict classifications, raw unit votes, unanimous variables, disagreeing variables, root-assigned skips, saved-phase writes, and effective saved-phase changes."
everything_else = "Keep the promoted usage-score initialization and increments, 2048-conflict decay, reduction schedule and fractions, EVSIDS, Luby root restarts, chronological backtracking, phase saving, proof logging, model reconstruction, minimization, propagation, preprocessing defaults, and every unrelated policy unchanged."

