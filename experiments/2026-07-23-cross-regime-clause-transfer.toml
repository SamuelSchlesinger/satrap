[correctness]
unit = "Test origin tagging for long and binary learned clauses, exclusion of originals and units, qualifying versus non-qualifying use, once-per-clause-per-epoch credit, directional ownership, epoch normalization, smoothing, exact warmup/probe/exploit schedule, deterministic ties, dual heap repair, and mode switches."
differential = "Extend the deterministic brute-force differential suite to --search=transfer, including every optional-feature regression whose combination is semantically supported."
models = "Independently validate every SAT model emitted in development and endpoint runs."
proof = "Emit treatment DRAT proofs for both endpoints when solved within 25 seconds and require independent DRAT-trim verification. At minimum, independently verify one nontrivial UNSAT treatment proof; a timeout remains a performance-gate failure even if another proof verifies."
trajectory = "Rebuild frozen pure EVSIDS and LRB configurations from the modified source and require their exact deterministic counters to match the recorded baseline trajectories. Require repeat transfer executions on selected and endpoint instances to have identical results and counters."
metadata = "Assert optional transfer metadata lengths track long and binary clause storage only in transfer mode, survive deletion without aliasing, and remain empty in every pure mode."
exercise = "Require positive EVSIDS and LRB epoch counts, at least two mode switches, positive EVSIDS-origin credit consumed by LRB, and positive LRB-origin credit consumed by EVSIDS on at least one nontrivial development or endpoint instance."

