summary = "The transfer treatment was correct, deterministic on every completed run, cheap on smoke, and exercised both warmed branchers plus both directions of cross-regime credit. The performance hypothesis failed decisively. Treatment solved 3/8 two-second development instances versus LRB's 4/8, regressed 43.54% and 119.24% against the faster pure arm on the repeated jointly solved cases, took 18.72 seconds on 6s268 versus LRB's 1.22 seconds, and timed out on Break where EVSIDS took 3.07 seconds."
conclusion = "Rejected as a performance candidate and default. Retained behind --search=transfer as a correctness-checked negative research result because its counters expose the failure mechanism. Cross-regime clause-use rate is measurable but is not a reliable proxy for which producer regime will solve faster. No novelty or priority claim is made, and the signal or schedule will not be tuned on these revealed families."

