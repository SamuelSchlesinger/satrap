[preregistration_note]
pre_execution_correction = "Before any transfer executable, correctness run, or performance result existed, the warmup was corrected from eight scored alternating epochs to one unscored EVSIDS bootstrap plus eight scored alternating epochs. The original wording would have treated epoch 1 as an LRB-producer observation before LRB had produced any clause, introducing an asymmetric forced zero. No other policy or gate changed."

[hypothesis]
mechanism = "EVSIDS and LRB expose sharply complementary search trajectories. A clause learned under one trajectory provides delayed evidence about that trajectory's reusable knowledge only if the clause later performs useful work under the other trajectory. Cross-regime use therefore supplies a causal, search-internal credit signal that immediate conflict rate, learned-clause LBD, and same-regime clause activity cannot provide."
prediction = "A deterministic dual-warm EVSIDS/LRB controller driven only by cross-regime learned-clause use will preserve the useful LRB trajectory on 6s268 while escaping its Break_12_50 failure, solve at least the four two-second development instances solved by the better pure arm, and stay within ten percent of the per-instance pure-arm oracle on the jointly solved development set."
falsification = "Reject the controller if it solves fewer two-second development instances than full LRB; exceeds the per-instance pure-arm oracle median by more than twenty-five percent on any selected development or endpoint instance; exceeds the pooled pure-arm oracle median by more than ten percent; exceeds ten percent easy-instance overhead relative to EVSIDS; fails to exercise both regimes and both directions of cross-regime credit; changes either frozen pure-mode trajectory; or fails any model, proof, differential, determinism, or metadata-integrity check. Do not tune the warmup length, probe cadence, reward definition, smoothing factor, restart policy, or promotion thresholds after observing treatment results."

[prior_art]
maple_hybrid = "MapleCOMSPS and MapleGlucose use established LRB/VSIDS hybrids, including fixed time, conflict, and restart-boundary switches; https://maplesat.github.io/"
restart_bandits = "Kissat_MAB and later work select branching regimes at restart boundaries with conflict/decision rewards. Duration-aware restart MAB is current prior art; https://doi.org/10.4230/LIPIcs.CP.2021.20 and https://doi.org/10.4230/LIPIcs.CP.2026.39"
dynamic_configuration = "DynamicSAT applies UCB to online configuration selection with recent-LBD rewards; https://doi.org/10.4230/LIPIcs.CP.2025.34"
clause_utility = "CausalSAT studies the effect of branching regime on future learned-clause utility, including propagation and conflict-analysis usage; https://doi.org/10.4230/LIPIcs.SAT.2023.28"
clause_usage = "Recent LBD-free clause management counts learned-clause use in propagation and conflict analysis, ages it, and uses it for retention; https://arxiv.org/abs/2602.20829"
parallel_transfer = "Parallel clause-sharing work measures whether clauses useful to a producer remain useful to a distinct consumer search; https://doi.org/10.4230/LIPIcs.SAT.2024.17"
distinction = "The preregistered treatment does not claim that hybrid branching, restart-level selection, clause-use counting, or cross-worker clause transfer is new. Its provisional research distinction is the closed sequential feedback loop: tag clauses by the branching regime that produced them, observe only their use by the opposite live regime, and feed that delayed cross-regime transfer signal back into selection of the producer regime."
novelty_status = "No priority claim. A targeted literature search found the listed adjacent mechanisms but no exact sequential producer-credit loop. Treat this as a candidate algorithmic contribution whose novelty remains contingent on broader scholarly and source-code review."

[policy]
search_mode = "Add an opt-in --search=transfer mode. Keep --search=evsids and --search=lrb byte-for-byte trajectory compatible with their frozen implementations and keep EVSIDS as the default regardless of this experiment's outcome."
dual_warm_state = "Maintain independent EVSIDS and full-LRB score arrays and deterministic maximum heaps throughout transfer mode. Every analyzed conflict updates both score systems. Every assignment and unassignment updates LRB interval state even while EVSIDS selects decisions. Phase saving, the trail, clause database, proof, and all other search state remain shared."
initial_regime = "Begin search in EVSIDS. Epoch 1 is an unscored producer bootstrap because no LRB-origin clause can exist yet."
epoch = "One controller epoch is one existing Luby restart interval. Restarts always return to decision level zero and retain the frozen Luby sequence. A root conflict or completed model ends solving without fabricating a partial epoch observation."
clause_origin = "Every learned clause of length at least two is tagged with the regime active when it was allocated. Original clauses and learned units have no origin and are excluded. Store origin and last-credited epoch in optional side arrays allocated only by transfer mode; do not expand default Clause, binary-clause, Watch, or reason metadata."
qualifying_use = "A learned clause earns at most one credit in a controller epoch when, under the opposite active regime, it first (a) forces a unit propagation, (b) is the conflicting clause returned by propagation, or (c) is traversed as a reason/conflict clause during first-UIP analysis. Merely inspecting a watch, finding a satisfied blocker, moving a watch, allocating, minimizing, retaining, or deleting a clause is not use. Repeated qualifying events for the same clause in the same epoch count once."
direction = "Credit belongs to the clause-producing regime, never the currently consuming regime. Maintain separate EVSIDS-origin and LRB-origin credit counts. Same-regime use produces no controller credit."
epoch_sample = "At restart after every epoch except bootstrap epoch 1, update only the inactive producer's estimate with sample = 1000 * distinct cross-regime credits for that producer during the completed epoch / conflicts in the completed epoch. Restart intervals contain at least one conflict; use max(conflicts,1) defensively."
smoothing = "For each producer independently, set its estimate to its first observed sample. Thereafter update estimate = 0.75 * estimate + 0.25 * sample. Comparisons use IEEE-754 total order and break exact ties in favor of EVSIDS."
schedule = "Epoch 1 is an unscored EVSIDS bootstrap. Epochs 2 through 9 alternate LRB, EVSIDS, LRB, EVSIDS, giving four scored consumer observations for each producer. Thereafter repeat ten-epoch cycles: one EVSIDS consumer probe, one LRB consumer probe, then eight epochs using the producer with the greater smoothed transfer estimate after both probes. Recompute the winner only after the two probes; do not switch within the eight exploitation epochs."
switching = "Change only which warmed heap supplies the next decision after a root restart. Do not clear scores, phases, LRB interval history, clauses, activities, or controller estimates on a regime switch."
everything_else = "Use phase saving, first-UIP analysis, recursive minimization, chronological backtracking, clause activity/LBD reduction, sparse binary activity, packed storage, proof logging, and all preprocessing defaults of the frozen control. Disable rephasing, tiers, elimination, arena compaction, binary minimization, subsumption, vivification, failed-literal probing, and trail reuse exactly as in the branching baselines."

