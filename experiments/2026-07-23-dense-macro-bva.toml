secondary_metrics = [
  "guard decision and short-clause density",
  "guarded versus unrestricted exact-BVA wall time",
  "accepted and macro-rejected products",
  "extension variables and net clause reduction",
  "development solved count and deterministic search counters",
  "pooled easy overhead",
]
stopping_rule = "Implement both frozen predicates once, complete correctness checks, and execute the declared comparisons. Do not tune thresholds on these reused corpora."

[correctness]
unit = "Test density just below, at, and above 16-to-1; empty and unused declared variables; macro products just below and at the half-matrix boundary; deterministic counters; root simplification; and proof/model behavior."
differential = "Run all 2000 deterministic brute-force formulas with guarded mode enabled and require exact input-length SAT models satisfying the original formula."
proof = "Forward-check the crafted RAT proof and K3-L1 REGN proof under guarded mode."
disabled_equivalence = "The modified binary under --no-factor must reproduce the frozen promoted 6s268 trajectory exactly."

[promotion_gate]
regn_solved_minimum = 4
regn_per_case_max_regression_percent_vs_exact = 10
development_solved_minimum = 5
development_snapshot_entries_maximum = 0
development_exact_search_trajectory_required = true
easy_overhead_max_percent = 5
sat_model_validation_required = true
proof_validation_required = true
default_promotion = "not authorized from reused corpora; a pass only advances guarded mode to an untouched generalization gate"
next_step = "If this capability-retention gate passes, freeze the guarded binary and construct a new license-compatible, family-stratified untouched corpus before considering a default. Then begin a separate prior-art-reviewed proof-regularity experiment."

