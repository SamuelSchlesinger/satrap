[experiment]
id = "2026-07-23-dense-macro-bva"
owner = "Codex"
status = "results complete; mixed; retained opt-in; K4-L2 certification pending"
worktree_revision = "uncommitted worktree after exact-neighborhood BVA"

[diagnosis]
source_experiment = "experiments/2026-07-23-exact-neighborhood-bva.toml"
training_derived = true
boundary = "This policy is derived after observing the REGN training and eight-instance development outcomes. Passing those same corpora can justify retaining the policy for a later untouched gate, but cannot establish generalization or default promotion."
beneficial = "On four solved REGN cases, exact BVA introduced 54-206 variables and removed 87-93 percent of matrix clauses. Peak products ranged from 64 by 256 to 256 by 2048. Coverage rose from 1/6 to 4/6."
harmful = "On Break_12_50, 1056 separate 3-by-3 products removed only 2112 net clauses, raised conflicts from 37717 to 131742, and regressed the repeated median 372 percent."
overhead = "On 6s268 no product was accepted, deterministic search counters were unchanged, but scanning 1644115 candidate clauses and 4306286 literals regressed the repeated median about 50 percent."
static_separation = "Before root simplification, every REGN training instance has at least 32 short clauses per input variable. Every development instance has fewer than 9 short candidate clauses per input variable."

[hypothesis]
mechanism = "A cheap input-density gate can avoid whole-snapshot work on structurally sparse formulas, while a macro-product gate can reject small exact rewrites whose clause savings are too weak to justify changing the CDCL variable space. Dense formulas with at least 16 short clauses per input variable and products that remove at least half their matrix should retain the REGN capability."
prediction = "The guarded mode will retain 4/6 five-second REGN solves, restore the promoted 5/8 development coverage and exact search trajectories there, keep every solved REGN case within ten percent of unrestricted exact BVA, and add less than five percent pooled smoke overhead."
falsification = "Reject the guarded policy unchanged if REGN coverage falls below 4/6, development coverage falls below 5/8, any guarded SAT model or UNSAT proof fails, any solved REGN case regresses more than ten percent against unrestricted exact BVA, any development instance enters the expensive snapshot despite failing the frozen density predicate, or pooled smoke overhead exceeds five percent. Do not alter either threshold after observing results."

[prior_art]
established = "Bounded variable addition, formula factoring, size thresholds, and preprocessing effort gates are established SAT engineering."
novelty_status = "Baseline deployment engineering only. The 16-to-1 density threshold and half-matrix reduction rule are training-derived heuristics; no novelty, priority, or generalization claim."
future_boundary = "A genuinely novel contribution must add new proof-search information or intervention semantics after this baseline is stable; retuning these thresholds is not that contribution."

[policy]
name = "dense macro exact-neighborhood BVA"
switch = "--factor-macro"
control_switch = "--factor"
default = "disabled; eligibility for a later untouched gate only"
input_short_clause = "A non-tautological normalized input clause of length two through five. Count it during clause ingestion, before root assignments or any simplifier."
density_gate = "Enter exact-neighborhood snapshot construction only when input_short_clause_count is at least 16 times the external input-variable count. Empty-variable formulas are ineligible."
density_numerator = 16
density_denominator = 1
product_gate = "After exact quotient neighborhoods are verified, accept a product only when matrix clause count is at least twice replacement clause count: m*n >= 2*(m+n)."
minimum_reduction_fraction = 0.5
unchanged = "Candidate lengths, exact complete neighborhoods, deterministic plan order, overlap handling, eight rounds, literal-touch budget, fresh-variable model projection, and RAT proof order remain byte-for-byte the unrestricted exact-BVA policy."
accounting = "Report the ingested short-clause count, density-gate checks and skips, products rejected by the macro rule, and all existing factorization counters."

[variants]
promoted_control = "/private/tmp/sat-baselines-20260723/sat-promoted-lbd-free-clause-management"
exact_control = "/private/tmp/sat-baselines-20260723/sat-exact-neighborhood-bva --factor"
treatment = "target/release/sat --factor-macro"

