[experiment]
id = "2026-07-23-exact-neighborhood-bva"
owner = "Codex"
status = "complete; rejected default; retained opt-in"
worktree_revision = "uncommitted initial worktree"

[diagnosis]
gap = "On six disjoint REGN training instances at five seconds, pinned Kissat 4.0.4 solved 4/6, the promoted Rust solver solved 1/6, and CaDiCaL 3.0.1 solved 0/6."
reference_ablation = "On REGRandom-K4-L1-Seed30, instrumented Kissat solved in 1.95 seconds with 318 factored extension variables and 6038 conflicts. --factor=false timed out at five seconds after 312527 conflicts; --sweep=false reproduced the default 6038-conflict trajectory."
benchmark_structure = "The SAT Competition 2024 REGN description says these shuffled formulas have polynomial unrestricted-resolution proofs, were intended to stress variable ordering, and were proposed to study bounded-variable-elimination cooperation with CDCL."

[hypothesis]
mechanism = "Exact Cartesian products of short original clauses can be represented by a fresh extension variable. Replacing every clause f_i OR Q_j in an m-by-n product by m clauses x OR f_i and n clauses not-x OR Q_j preserves satisfiability while reducing clause count from m*n to m+n and exposing an extended-resolution proof structure."
prediction = "A deterministic exact-neighborhood bounded-variable-addition pass will reduce at least one REGN formula, improve the five-second REGN training solved count from 1/6 to at least 3/6, and preserve the promoted solver's 5/8 two-second development solved count."
falsification = "Reject default promotion unchanged if the REGN solved count is below 3/6, development coverage falls, any SAT projection is invalid, the crafted or real UNSAT proof fails DRAT-trim, a jointly solved development case regresses by more than ten percent, or pooled easy overhead exceeds five percent. Do not tune limits after observing results."

[prior_art]
checked = [
  "Manthey, Heule, and Biere, Automated Reencoding of Boolean Formulas, Hardware and Software: Verification and Testing 2012",
  "Jarvisalo, Heule, and Biere, Inprocessing Rules, IJCAR 2012",
  "Kissat 4.0.4 commit 8af8e56f174b778aef3aa45af9f739b2a5f492c2 src/factor.c",
  "Li et al., Simplified and Randomized Formula REGN, Proceedings of SAT Competition 2024, pages 44-45",
]
established = "Bounded variable addition, formula factoring, and extension-variable proof steps are established SAT preprocessing. Kissat greedily factors exact clause products and is the direct reference implementation for the missing capability."
distinction = "This Rust baseline groups literals only when their complete active short-clause quotient neighborhoods are exactly equal. It uses whole-round snapshots and no partial-overlap, structural-hop, or learned-clause factoring."
novelty_status = "Baseline engineering only; no novelty or priority claim."

[policy]
name = "exact short-clause quotient-neighborhood BVA"
switch = "--factor; --no-factor is the default"
schedule = "At level zero, after all other enabled root simplifiers and zero-growth BVE, run at most eight whole-snapshot rounds before the first CDCL decision."
candidates = "Active non-learned clauses whose root-simplified canonical length is between two and five. Skip root-satisfied clauses and remove root-false literals."
neighborhood = "For every candidate literal f, define its quotient neighborhood as the sorted unique set of candidate clauses with f removed. Group factor literals only when these complete quotient neighborhoods are byte-for-byte equal and contain at least two quotients."
selection = "For every exact group with at least two factors, compute reduction m*n-m-n. Sort groups by descending reduction, then lexicographically by factors and quotients. Accept only strict clause-count reductions and skip a group if any matrix clause was removed by an earlier group in the same round."
rewrite = "Allocate one fresh internal variable x. Proof-log and install every divider x OR f_i, then every quotient clause not-x OR Q_j while all matrix clauses remain present. Lazily delete the m*n matrix clauses only after all replacements are installed."
rounds = 8
maximum_candidate_clause_length = 5
effort = "Charge root-simplified candidate literals and quotient-materialization literals. Stop before exceeding max(1000000, min(100000000, 16 times the first-round candidate-literal count))."
model = "Fresh variables are existential extensions. A satisfying assignment of the transformed formula restricted to the original variables satisfies every removed matrix clause; emitted models omit extension variables."
proof = "Divider clauses are RAT on fresh x because not-x is absent. Each quotient clause is RAT on not-x because every resolvent against a divider is one of the still-present matrix clauses. Proof deletions remain omitted."
default = "disabled until the full promotion gate passes"

[variants]
control = "/private/tmp/sat-baselines-20260723/sat-promoted-lbd-free-clause-management --no-factor"
treatment = "target/release/sat --factor"
compiler = "rustc stable with -C target-cpu=native and release fat LTO"

[corpus.training]
manifest = "benchmarks/manifests/reg-n-training.json"
role = "training"
instances = 6
family = "reg-n"
deduplication = "sha256"
revealed_2025_case = "46355da785714f239393e7630020cae3-REGRandom-K4-L1-Seed40.sanitized.cnf is excluded from implementation and gate decisions."

[corpus.development]
manifest = "benchmarks/manifests/satcomp-2025-development.json"
role = "revealed development"
instances = 8

[protocol]
regn_timeout_seconds = 5
regn_repetitions = 1
development_timeout_seconds = 2
development_repetitions = 1
jointly_solved_repetitions = 7
endpoint_instances = ["Break_12_50.xml.cnf", "6s268r_Iter94.cnf"]
endpoint_repetitions = 3
endpoint_timeout_seconds = 25
easy_overhead_repetitions = 11
threads = 1
order_seed = 2026072305
primary_metric = "validated solved count on the six-instance REGN training corpus at five seconds"
secondary_metrics = [
  "extension variables introduced",
  "candidate clauses and literal touches",
  "matrix clauses removed and replacement clauses installed",
  "clause-count reduction",
  "factor and quotient widths",
  "conflicts and propagations",
  "paired wall time",
]
stopping_rule = "Implement the frozen policy once, complete correctness and proof checks, then execute the declared comparisons. Do not alter the neighborhood definition, limits, round count, or selector after observing results."

[correctness]
unit_tests = "Exercise exact binary and ternary products, non-products, partial overlaps, root simplification, duplicate clauses, same-round overlap, multiple rounds, effort exhaustion, deterministic tie breaking, fresh-variable growth, and model projection."
differential = "Add --factor to deterministic brute-force differential testing and require every SAT model to have exactly the original variable count and satisfy the original clauses."
sat_model = "Retain a crafted satisfiable product whose internal extension variable is projected out."
unsat_proof = "Require DRAT-trim verification on a crafted factorization and REGRandom-K3-L1-Seed20 if the treatment solves it."
disabled_equivalence = "The final binary with --no-factor must reproduce the promoted control's deterministic search counters on 6s268."

[promotion_gate]
regn_control_solved = 1
regn_treatment_solved_minimum = 3
development_control_solved = 5
development_treatment_solved_minimum = 5
jointly_solved_max_regression_percent = 10
endpoint_max_regression_percent = 10
easy_overhead_max_percent = 5
sat_model_validation_required = true
proof_required = true
next_step = "If the capability gate passes, retain exact-neighborhood BVA and separately preregister a genuinely novel proof-regularity intervention. If it fails, preserve only the correctness foundation and diagnose which partial products Kissat factors."

