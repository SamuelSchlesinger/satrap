summary = "At five seconds, treatment raised REGN coverage from 1/6 to 4/6 and solved the same four cases as pinned Kissat 4.0.4. At two seconds on the unchanged development slice, it lost Break_12_50 and fell from 5/8 to 4/8. Exact products on Break changed the deterministic trajectory from 37717 to 131742 conflicts; even cases with no accepted product paid a substantial full-snapshot scan cost. The mechanism is a major family-specific capability but is not safe as an unconditional default."

