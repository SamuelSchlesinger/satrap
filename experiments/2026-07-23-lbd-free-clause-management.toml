[experiment]
id = "2026-07-23-lbd-free-clause-management"
owner = "Codex"
status = "promoted as default"
worktree_revision = "uncommitted initial worktree"
control_binary = "/private/tmp/sat-baselines-20260723/sat-promoted-sparse-binary-activity"
control_sha256 = "d0e9d16c7407eac20c536e00f4624aee52aa923a73c8de49c689919c5ba0041e"
treatment_binary = "/private/tmp/sat-baselines-20260723/sat-lbd-free-clause-management"
treatment_sha256 = "7019d09ece2f4f0b6d9d040769c12c531bc586d60aaaa56aafc2805e096e3a69"

[hypothesis]
mechanism = "The default reducer predicts learned-clause value from LBD and conflict-analysis activity, but ignores clauses that repeatedly steer Boolean propagation. A two-stage LBD-free policy can preserve clauses with demonstrated recent use in either BCP or conflict analysis, age obsolete evidence, then use only clause length to give unused short clauses a second chance."
prediction = "The published MiniSat-style LBD-free usage policy will retain useful propagation clauses missed by the default LBD/activity ordering, preserve at least the control's validated two-second development solved count, and either add a solve or improve the jointly solved pooled median by at least five percent without a catastrophic endpoint or easy-instance regression."
falsification = "Do not promote the policy if it loses a two-second development solve; neither adds a solve nor improves the frozen jointly solved pooled median by at least five percent; any selected or endpoint median regresses by more than twenty-five percent; endpoint pooled median regresses by more than ten percent; easy pooled overhead exceeds ten percent; the usage, decay, protection, zero-score selection, dynamic fraction, or square-root schedule is not exercised; the default trajectory changes; or any model, proof, differential, determinism, or metadata check fails. Do not tune the decay interval, reduction schedule, fraction, score definition, binary policy, or thresholds after observing treatment results."

[prior_art]
paper = "Yalun Cai, Xindi Zhang, Zhengyuan Shi, Mengxia Tao, and Qiang Xu, Rethinking Clause Management for CDCL SAT Solvers, arXiv:2602.20829v2, 25 February 2026, https://arxiv.org/abs/2602.20829"
reference_repository = "https://github.com/RethinkingClauseManagement/RethinkingClauseManagement"
reference_commit = "a77eccdc188be0700a3a80d8c9f04c78e596a71a"
reference_implementation = "Solvers/MiniSAT_ours/minisat/core/Solver.cc, Solver.h, and SolverTypes.h at the pinned commit"
established = "The score initialization, BCP and analysis increments, 2048-conflict MiniSat decay interval, two-stage positive-score/length policy, 0.50-to-0.90 deletion fraction, and square-root reduction schedule are the authors' published and released mechanism. This treatment is a current established baseline, not an algorithmic novelty."
reported_result = "The paper reports four additional solves and a 4.7 percent PAR-2 reduction for its Kissat variant on SAT Competition 2022, plus large gains on arithmetic circuit equivalence instances. Those claims are context, not results for this Rust solver."
distinction = "The host adaptation preserves permanent learned binaries, stable clause references, sparse binary activity, first-UIP minimization, chronological backtracking, Luby restarts, proof logging, and the promoted packed storage. The reference MiniSat source comments that binary clauses are never removed; this implementation makes that invariant explicit and applies usage scores only to reducible learned long clauses."
novelty_status = "Established 2026 clause-management baseline. No novelty claim."

[policy]
flag = "Add opt-in --lbd-free-reduction and --no-lbd-free-reduction flags. Keep the feature disabled by default regardless of this experiment's result until the frozen gate is evaluated."
score_storage = "Allocate a u32 side array aligned with long-clause references only when the feature is enabled. Original clauses have score 0. Every learned long clause starts at score 1. Do not expand Clause, binary-clause, Watch, or reason metadata."
score_use = "Saturating-increment a learned long clause's score once whenever it forces a unit propagation and once whenever it is traversed as the conflict or a reason clause during first-UIP analysis. A clause that first propagated a literal and is later traversed during analysis earns both increments, matching the reference implementation. Watch inspection, blocker hits, watch moves, allocation beyond the initial score, minimization without traversal, retention, and deletion do not increment."
decay = "Immediately after incrementing the global conflict count, every 2048 conflicts decrement each positive score of every active learned long clause by one. Deleted and original clauses are skipped. Learned binaries remain permanent and unscored."
reduction_schedule = "Trigger the first reduction at conflict 1000. Number reductions from r=1. After reduction r, schedule the next threshold by adding floor(1000*sqrt(r)) to the current conflict count."
stage_one = "At reduction, protect every locked learned long clause and every learned long clause with positive score. Only active, unlocked, zero-score learned long clauses enter Stage 2."
stage_two = "Sort Stage-2 candidates by length descending and clause reference ascending for a deterministic length-only order. Delete floor(fraction*candidate_count) leading candidates, where fraction=0.90-0.40/log10(r+9) for one-indexed reduction r. This is 0.50 at r=1 and asymptotically approaches 0.90. Do not consult LBD or floating-point clause activity."
binary_policy = "Keep learned binary clauses permanent, preserving the host solver's promoted binary invariant and the reference MiniSat reducer's stated binary exception."
activity = "Under the treatment, do not bump or decay the unused floating-point clause activity. EVSIDS variable activity is unchanged. Under the default, preserve clause-activity arithmetic exactly."
everything_else = "Use default EVSIDS, phase saving, first-UIP analysis, recursive minimization, chronological backtracking, Luby restarts, root restart, packed watches, split binary storage, proof logging, and all existing defaults. Disable rephasing, tiers, elimination, arena compaction, binary minimization, subsumption, vivification, probing, trail reuse, and every alternate search regime for both variants."

[variants]
control = "/private/tmp/sat-baselines-20260723/sat-promoted-sparse-binary-activity --search=evsids --restart=luby --reuse-trail=never --no-rephase --no-tiers --no-eliminate --no-compact-arena --no-binary-minimize --no-subsume --no-vivify --no-probe"
treatment = "target/release/sat --search=evsids --restart=luby --reuse-trail=never --lbd-free-reduction --no-rephase --no-tiers --no-eliminate --no-compact-arena --no-binary-minimize --no-subsume --no-vivify --no-probe"
compiler = "rustc stable with -C target-cpu=native and release fat LTO"

[pre_execution_amendment]
recorded = "2026-07-23, after implementation correctness tests and default-trajectory verification but before any treatment benchmark execution"
issue = "The preregistered control command passed --no-lbd-free-reduction to a frozen control binary built before that flag existed, which would reject the command instead of running the intended default."
correction = "Omit only --no-lbd-free-reduction from the frozen control command. The flag is a no-op default selector in the modified source; a release rebuild with that flag reproduced the frozen 6s268 trajectory exactly before treatment execution."
scope = "No treatment policy, corpus, timeout, repetition, seed, metric, or gate changed."

[corpus]
manifest = "benchmarks/manifests/satcomp-2025-development.json"
role = "development"
deduplication = "sha256"
heldout_use = "none"
arithmetic_corpus = "The authors' circuit corpus was acquired and pinned for later domain validation but is not part of this promotion gate; its published runtimes require materially longer limits than the present development protocol."

