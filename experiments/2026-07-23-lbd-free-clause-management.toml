summary = "The published LBD-free clause-management treatment passed every frozen gate. It raised validated two-second development coverage from 3/8 to 5/8 with no lost solve, adding one SAT and one UNSAT result. The two jointly solved nontrivial cases regressed by 7.74% and 8.76%, both inside the 25% ceiling; their pooled median regressed 8.23%, but the qualifying solved-count branch had already passed. Break improved 58.84%, 6s268 improved 88.45%, pooled endpoint time improved 77.20%, and easy overhead was 0.44%."
conclusion = "Promoted as the default learned-clause reducer. The exact former LBD/activity policy remains available through --no-lbd-free-reduction. This is an implementation and validation of Cai et al.'s established 2026 mechanism, not a novel contribution. No post-promotion held-out result is claimed in this artifact."

