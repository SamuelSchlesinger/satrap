full_slice_timeout_seconds = 2
full_slice_repetitions = 1
jointly_solved_repetitions = 7
jointly_solved_selection = "After the frozen full-slice control/treatment run, repeat every development instance that both variants solve and whose control or treatment wall time is at least 0.1 seconds. Freeze this set before repeats."
endpoint_instances = ["Break_12_50.xml.cnf", "6s268r_Iter94.cnf"]
endpoint_timeout_seconds = 25
endpoint_repetitions = 3
easy_overhead_repetitions = 11
proof_instance = "6s268r_Iter94.cnf"
threads = 1
order_seed = 20251103
primary_metric = "validated two-second development solved count, then pooled median time on the frozen jointly solved set"
secondary_metrics = [
  "per-instance selected medians",
  "pooled and per-instance endpoint medians",
  "easy-instance pooled overhead",
  "decisions, propagations, conflicts, restarts, learned literals, reductions, deleted clauses, usage increments, decay passes, decayed scores, positive protections, and zero-score candidates",
]
stopping_rule = "Implement the frozen policy once, run correctness and proof checks, then execute the declared comparisons. Do not consume held-out data or tune T, reduction timing, deletion fraction, score semantics, binary deletion, search, restart, or other clause-management parameters from treatment results."

[correctness]
unit = "Test score initialization, saturating BCP and analysis increments, double use through both channels, exact 2048-conflict decay, deleted/original exclusion, positive-score and lock protection, length-only deletion, deterministic ties, dynamic fractions, and square-root thresholds."
differential = "Extend the deterministic brute-force differential suite to --lbd-free-reduction, including every optional-feature regression whose combination is semantically supported."
models = "Independently validate every SAT model emitted in development and endpoint runs."
proof = "Emit a treatment DRAT proof for 6s268 under the endpoint timeout and require independent DRAT-trim verification."
trajectory = "Rebuild the frozen default configuration from modified source and require its exact 6s268 deterministic counters to match the promoted control. Require repeat treatment executions on every selected and endpoint instance to produce identical result and counters."
metadata = "Require usage side-array length to match long-clause storage under the feature, remain aligned through deletion and optional compaction, and remain empty under the default and every unrelated mode."
exercise = "Require positive BCP increments, analysis increments, decay passes, scores decayed, positive-score protections, zero-score candidates, reductions, and deletions on at least one nontrivial development or endpoint instance."

[promotion_gate]
development_solved_delta_minimum = 0
qualifying_improvement = "Either treatment development solved count exceeds control, or counts tie and jointly solved pooled median improves by at least 5 percent."
jointly_solved_pooled_improvement_percent_minimum_if_tied = 5
jointly_solved_max_regression_percent = 25
endpoint_pooled_max_regression_percent = 10
endpoint_max_regression_percent = 25
easy_overhead_max_percent = 10
default_trajectory_exact_required = true
deterministic_treatment_reproducibility_required = true
usage_mechanisms_exercised_required = true
sat_model_validation_required = true
proof_validation_required = true
next_step = "If promoted, make the LBD-free policy the default only after documenting its established origin and then validate once on untouched held-out data. If rejected, retain it opt-in only if correctness passes, record the negative result, and use its measured protection/deletion behavior to select a separately preregistered novel clause-management intervention without parameter retuning."

