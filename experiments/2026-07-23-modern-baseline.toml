full_slice_result_sha256 = "3eaee073f838a482ce95177fcc216f94d0f093e988ee5c93a3afd1743e5815cb"
repeat7_result_sha256 = "3f1cb09de23b4888f21ca7b70f1ae55e75600e059777f1c45d1fdee75798806e"
observation = "Mixed: 48,713 literals removed on gm24sparrc; repeat-7 median improved about 4.4 percent on 6s299b685_Iter22 and regressed about 2.2 percent on gm24sparrc. Retain as ablatable default pending a larger corpus."

[mechanisms.binary_fast_path]
hypothesis = "Direct binary implication will reduce watch-path work on binary-heavy formulas."
switch = "--no-binary-fast-path"
full_slice_result_sha256 = "39f222dca3bde6a5bfee24f2ccda440803769915940f8c6f48b5ec1ef9ba160e"
repeat7_result_sha256 = "fdc926529f2a47e89906b7ae35640286300688ef3a0d914a6956023336c596eb"
observation = "Directional: repeat-7 median improved about 7.4 percent on binary-heavy 6s299b685_Iter22, where 2,545,471 binary watch visits were observed; multiplier results were noisy and mixed. Retain pending broader measurement."

[mechanisms.dynamic_lbd_restarts]
hypothesis = "Recent learned-clause LBD degradation can identify unproductive search earlier than the static Luby schedule."
switch = "--restart=lbd; --no-block-restarts ablates the deep-trail guard"
source = "Audemard and Simon dynamic and blocking restart rules; Glucose 4.2.1 official source"
repeat7_result_sha256 = "b765332e4d8b000ab34848e5d1b82d20cb0ca77b0f4b494a1448cef875e7aff8"
break12_repeat3_result_sha256 = "dde3a9cdf5202a7b130f935703a28a477a7ecb7b4c91f4223c94eae1d8fb6951"
blocking_smoke_result_sha256 = "087a12805501e22eb64d4e2a95a1844a25e70c3b7a0c437bdd093bc2e01f9ae4"
observation = "Rejected as the default. LBD improved the 6s299b685_Iter22 repeat-7 median by about 29 percent and regressed gm24sparrc by about 3.7 percent. More importantly, all three unblocked LBD runs timed out at 15 seconds on Break_12_50 while all Luby runs solved (9.54 second median); the documented deep-trail blocking rule also timed out in a one-run smoke. Retain only as an experimental mode and pursue focused/stable scheduling."

[mechanisms.focused_stable_search]
hypothesis = "VMTF branching with LBD-EMA focused restarts, alternated with EVSIDS and reluctant stable restarts, can combine complementary strengths that neither VMTF nor dynamic restarts exhibits alone."
switch = "--search=focused-stable; axis controls are --search=vmtf and --search=focused"
repeat7_result_sha256 = "5ca92a5b5682423e7cc6bb261c59480c9124b08e645e7569fc4d4084f7f8389c"
axis_repeat7_result_sha256 = "dbf89a5cc0adca6e061b8298612805847687b85f3d7c705534ab2fad253b73e9"
break12_repeat3_result_sha256 = "f00ca2517012df2f6dcf401ed29cb7d8d8681ed905e97b11ed6398943fc388bd"
observation = "Strong non-additive development signal: focused VMTF/EMA cut gm24sparrc from about 0.51 s to 0.13 s while pure VMTF/Luby regressed it to 1.33 s. Focused search regressed the hardware case; focused/stable recovered part of that loss and was neutral on Break_12_50. This motivated a bounded focused probe rather than default promotion."

[mechanisms.focused_probe]
hypothesis = "A bounded focused phase can acquire high-value VMTF/LBD-EMA clauses and warm EVSIDS without paying the long-run family regressions of permanently focused search."
switch = "--search=probe-evsids; --search=probe-vmtf isolates the post-probe branching choice"
cutoff_conflicts = 100
cutoff_rationale = "one base Luby interval and approximately three fast LBD-EMA windows"
development_repeat7_result_sha256 = "e4feb0b7e649f58835bd37079d7c8e5c7911e4d62a5c6ef28e6ca573dbf44e57"
development_break12_repeat3_result_sha256 = "78aa2aaf5afeb095d9eba9a9cd8f39fc33f40e4198290abbd31b3e9e8e4daa87"
