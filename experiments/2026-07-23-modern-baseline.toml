development_full_slice_result_sha256 = "a39ec8bcc35d39290821782c5da9b7c095cead3f018e7f75b7ae6f2316dae3f6"
heldout_result_sha256 = "552446485e2a3dd9663ec8774c8e6858cd7ee37311e157f9b2e96385213dfbfb"
heldout_confirmation_result_sha256 = "7fa2ad88b83683f6026f875afae9190bb8a075e00b3589a4f142048a4237f508"
observation = "Rejected for default promotion. Development results were large, including an 8.4x Break_12_50 median gain and 4/8 solved at 2 s versus 3/8 for each reference. On the outcome-blind family-disjoint gate, probe and EVSIDS both solved 2/16 while Kissat solved 3/16. On the nontrivial jointly solved held-out SAT instance, the repeat-3 probe median was 3.080 s versus 2.450 s for EVSIDS. Keep as an ablatable negative result and do not tune the cutoff on revealed held-out families."

[mechanisms.tiered_clause_retention]
