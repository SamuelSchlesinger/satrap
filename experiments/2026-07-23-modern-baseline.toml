observation = "Retained as a complementary mode, not promoted globally. It increased 2 s development coverage from 3/8 to 4/8 by solving 6s268r_Iter94. On that instance, repeat-3 medians were 0.634 s with reuse and 5.536 s with root restarts, while pinned Kissat 4.0.4 and CaDiCaL 3.0.1 timed out in all three 10 s runs; the independently checked proof verifies UNSAT. Conversely, Break_12_50 regressed from 3.611 to 19.389 s (5.37x). The disabled binary showed no measurable penalty versus the pre-feature binary. This complementarity motivates a preregistered contextual selector rather than held-out tuning or default promotion."

