[hypothesis]
mechanism = "The promoted LBD-free reducer counts useful clause events but treats every positive score as free protection. Some previously useful clauses subsequently consume substantial Boolean-propagation work through blocker checks and replacement scans without propagating or contributing to analysis. Exact post-use scan debt estimates this negative marginal work directly. Under the same reduction schedule and deletion count, allowing high-debt clauses to displace low-debt clauses should reduce wasted propagation work without indiscriminately shrinking the learned database."
prediction = "The scan-debt treatment will preserve the control's validated two-second development solved count and either add a solve or improve the jointly solved pooled median by at least five percent. On at least one nontrivial case it will make a deletion choice different from the published usage/length baseline, delete a positive-score high-debt clause, or otherwise demonstrate a nonzero exact-work displacement while staying within the frozen endpoint and easy-overhead ceilings."
falsification = "Reject the treatment if it loses a two-second development solve; neither adds a solve nor improves the frozen jointly solved pooled median by at least five percent; any selected or endpoint median regresses by more than twenty-five percent; endpoint pooled median regresses by more than ten percent; easy pooled overhead exceeds ten percent; no deletion selection changes despite nonzero scan debt; the zero-debt comparator differs from the promoted policy; or any model, proof, differential, determinism, metadata, or accounting check fails. Do not tune the charged operations, reset events, comparator, schedule, fraction, or thresholds after observing treatment results."

[prior_art]
promoted_control = "Yalun Cai, Xindi Zhang, Zhengyuan Shi, Mengxia Tao, and Qiang Xu, Rethinking Clause Management for CDCL SAT Solvers, arXiv:2602.20829v2, 2026, https://arxiv.org/abs/2602.20829"
recent_unlearning = "Bernhard Gstrein, Florian Pollitt, Andre Schidler, Mathias Fleury, and Armin Biere, Learn to Unlearn, SAT 2025, DOI 10.4230/LIPIcs.SAT.2025.14"
simple_online_reduction = "Sima Jamali and David Mitchell, Simplifying CDCL Clause Database Reduction, SAT 2019, DOI 10.1007/978-3-030-24258-9_12"
elapsed_cost_proxy = "David Scott McGrew, Boolean satisfiability SAT solver, US10650109B1, 2020, especially value_of_clause=1/(time_since_last_propagation_through_clause*clause_length)"
stable_watches = "Ashlin Iser and Tomas Balyo, Unit Propagation with Stable Watches, CP 2021, DOI 10.4230/LIPIcs.CP.2021.6"
freezing = "Gilles Audemard, Jean-Marie Lagniez, and Laurent Simon, On Freezing and Reactivating Learnt Clauses, SAT 2011, DOI 10.1007/978-3-642-21581-0_16"
causal_analysis = "Jiong Yang, Arijit Shaw, Teodora Baluta, Mate Soos, and Kuldeep S. Meel, Explaining SAT Solving Using Causal Reasoning, SAT 2023, DOI 10.4230/LIPIcs.SAT.2023.28"
established = "Clause activity, LBD, length, age, recent conflict-analysis use, propagation-use counts, saved-polarity relevance, stable watched-literal selection, approximate elapsed propagation cost, freezing/reactivation, and offline causal analysis are established. None is claimed here."
distinction = "The preregistered treatment measures the exact assignment-value checks actually spent on each active learned long clause after its last beneficial BCP or analysis use, then uses that accumulated negative evidence to alter a fixed-cardinality reduction decision. It does not approximate cost by clause length or elapsed time, change watched-literal selection, freeze clauses by saved phase, learn an offline model, or change the published reduction schedule or deletion count. A targeted paper, patent, source, and web search found close motivations but no exact post-use work-debt comparator. This is a provisional candidate contribution, not a priority or novelty proof."
novelty_status = "Candidate algorithmic contribution. No priority claim; novelty remains contingent on broader scholarly and source-code review plus a successful ablation."

[collision_audit]
rejected_rup_direction = "A proposed bounded current-database RUP/re-derivability deletion signal is not pursued as novel. US10650109B1 explicitly removes a clause, falsifies its literals, runs BCP against the remaining database, and deletes clauses proved redundant. Clause vivification and UCP-irredundancy supply additional adjacent prior art."
ucp_irredundancy = "Petr Savicky, On CNF formulas irredundant with respect to unit clause propagation, arXiv:2309.01750 and Theoretical Computer Science 1064 (2026) 115707"
consequence = "Do not revive clause-removal-plus-BCP implicativity as a novelty claim without a materially different mechanism and a new audit."

[policy]
flag = "Add opt-in --scan-debt-reduction and --no-scan-debt-reduction flags. Keep the treatment disabled by default regardless of this development result. The enabled form requires the promoted LBD-free reducer."
storage = "Allocate one u64 scan-debt side entry aligned with every long-clause reference only when the feature is enabled. Original and newly learned long clauses start at zero. Learned binaries remain permanent and untracked. Do not expand Clause, binary-clause, Watch, or reason metadata."
charged_work = "During ordinary search BCP only, saturating-add one debt unit to an active learned long clause for its blocker assignment-value check. If the blocker is not true, add one for the other watched literal check. If the other watch is not true, add one for every unwatched literal whose assignment is tested while searching for a replacement, including the successful or final failed test. Do not charge deleted/ignored clauses, binary clauses, original clauses, probe BCP, vivification BCP, watch-list copying, clause allocation, conflict analysis, or wall time."
beneficial_reset = "After charging the current visit, reset a learned long clause's debt to zero whenever it forces an ordinary unit propagation. Also reset it whenever the clause is traversed as the conflict or a reason during first-UIP analysis. A propagation followed by later analysis may reset twice, but only a nonzero-to-zero reset counts in diagnostics. Blocker hits, watch moves, conflicts before analysis, minimization-only access, retention, and deletion do not reset debt."
quota = "Compute locks and the unlocked zero-score pool exactly as the promoted LBD-free reducer. For one-indexed reduction r, delete exactly floor((0.90-0.40/log10(r+9))*zero_score_pool_size) clauses. Thus the treatment changes which clauses are deleted, never how many, at a given solver state."
ordering = "Place every active unlocked learned long clause in the treatment ordering. Sort by scan debt descending, usage score ascending, length descending, then clause reference ascending. Delete the first quota clauses. Locked clauses and learned binaries remain protected. With all debts zero, the zero-score prefix, length order, reference ties, and deletion set are exactly the promoted policy."
schedule = "Keep score initialization and BCP/analysis increments, 2048-conflict score decay, first reduction at conflict 1000, square-root reduction intervals, and dynamic deletion fraction exactly as promoted. Scan debt has no clock-based decay; beneficial use is its only reset."
diagnostics = "Report total charged literal checks, nonzero debt resets, peak debt, deletion-set displacements relative to the promoted comparator at the same state, positive-score clauses deleted, and zero-score baseline deletions rescued."
everything_else = "Use default EVSIDS, phase saving, first-UIP analysis, recursive minimization, chronological backtracking, Luby restarts, root restart, packed watches, split binary storage, proof logging, and all existing defaults. Disable rephasing, tiers, elimination, arena compaction, binary minimization, subsumption, vivification, probing, trail reuse, and every alternate search regime for both variants."

