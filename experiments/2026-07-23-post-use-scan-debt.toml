summary = "The treatment tied the promoted control at 5/8 validated two-second development solves but regressed every repeated nontrivial case. The sum of four per-instance medians rose 11.31%, so the primary qualifying gate failed. The two endpoints regressed 4.05% and 18.95%, with a 14.19% pooled regression that also exceeded the frozen 10% ceiling. Easy pooled overhead was 1.25%. Exact counters show why: when reductions were active, debt-first ranking displaced 20,349 baseline deletions on Break and 1,394 on 6s268, deleting 17,776 and 1,390 positive-score clauses respectively and increasing conflicts and learned literals."
conclusion = "Rejected as a performance candidate and default. Retained behind --scan-debt-reduction as a correctness- and proof-checked negative result because it exposes the failure mechanism. Raw post-use scan debt confounds avoidable cost with clause exposure: frequently visited, still useful clauses accumulate the most debt and are preferentially deleted. Do not normalize, reweight, or threshold this signal on the revealed development families. No novelty or priority claim is made from the negative result."

