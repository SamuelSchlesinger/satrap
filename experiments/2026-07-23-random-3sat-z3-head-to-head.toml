[results.conclusion]
summary = "At the five-second median cutoff, Rust solved all eight 250-variable formulas while Z3 solved six; neither solver solved a 500-, 750-, or 1000-variable formula. Rust therefore won solved count 8 to 6 and lowered corpus PAR-2 by 5.313 percent. On the six jointly solved formulas, however, Z3 won four and had a 3.994x geometric-mean speed advantage; Rust won the two jointly solved UNSAT cases and uniquely solved two more UNSAT cases."
claim = "The current Rust solver has a real solved-count edge over Z3 4.16.0 on this exact narrow random-3-SAT screen, including one independently proof-verified Z3-timeout UNSAT result. Z3 is substantially faster on the jointly solved subset. The coarse size grid leaves 24/32 formulas as double timeouts, so this is useful exploratory evidence rather than a general SAT, SMT, or state-of-the-art result."
