[experiment]
id = "2026-07-23-random-3sat-z3-head-to-head"
owner = "Codex"
status = "complete"
worktree_revision = "uncommitted initial worktree"
scope = "Exploratory pure-CNF head-to-head against Z3, not an SMT or state-of-the-art claim"

[question]
primary = "How does the current promoted Rust CDCL configuration compare with installed Z3 4.16.0 on deterministic uniform random 3-SAT near the satisfiability threshold?"
interpretation = "This measures one narrow synthetic distribution. It cannot establish general SAT performance, SMT performance, or superiority to Z3 on Z3's intended mixed-theory workloads."

[corpus]
family = "uniform random 3-SAT"
generator = "tools/generate_random_ksat.py"
generator_sha256 = "c528b54e2559de066dffee44ee44a3ac02e72852ad6cfec1eb067e952f8a1c90"
width = 3
clauses_per_variable = 4.267
variable_counts = [250, 500, 750, 1000]
instances_per_size = 8
seed_rule = "seed = 202607230000 + 10 * variable_count + index, for index 0 through 7"
corpus_directory = "/private/tmp/sat-random-z3-20260723/corpus"
expected_instance_count = 32
role = "fresh exploratory corpus; no heuristic changes may be selected from it and then re-evaluated on the same formulas"

[solvers.rust]
name = "sat-rust"
command = "/private/tmp/sat-random-z3-20260723/sat-rust --no-factor"
version = "sat 0.1.0, current promoted defaults"
binary_sha256 = "2235741f31c2da810da75de1deeec789bd55bb8c0d1baa003b0eaa132ca40d15"
notes = "Native release build with RUSTFLAGS=-C target-cpu=native; model output enabled; proof output disabled during timing"

[solvers.z3]
name = "z3"
command = "/opt/homebrew/bin/z3 -dimacs sat.threads=1"
version = "Z3 4.16.0 64-bit"
binary_sha256 = "edae32f9e37ea4b5bb35310d72f0e352d0dc07626cac4e9e30bc1ea9a5bc8efb"
notes = "DIMACS SAT frontend with one SAT thread; model output enabled"

[protocol]
runner = "tools/benchmark.py"
runner_sha256 = "16ee4e49930dd5b1fc4352b0433e29b691b5eb4a3efc4f53b291e48b71503348"
timeout_seconds = 5
repetitions = 3
task_order_seed = 20260723
threads_per_solver = 1
proof_logging_during_timing = false
competing_proof_checkers = "paused before timing and resumed afterward"
raw_output = "/private/tmp/sat-random-z3-20260723/head-to-head-repeat3.jsonl"

[validation]
sat = "The runner must validate every reported model against every original clause."
agreement = "Any SAT/UNSAT disagreement is a hard correctness failure and must remain visible."
unsat = "After timing, emit and independently DRAT-check at least one nontrivial Rust UNSAT result. Z3 UNSAT results are cross-checked by status agreement but Z3 does not emit DRAT through this invocation."
determinism = "Within each solver-instance pair, all three runs must agree on status. Runtime need not be identical."

[metrics]
primary = "solved count at five seconds, then PAR-2 over all 32 instances using per-instance median runtime"
secondary = [
  "SAT and UNSAT solved counts",
  "per-size solved counts",
  "per-size median and geometric-mean runtime on jointly solved instances",
  "per-instance median speed ratio",
  "wins and losses using a ten-percent practical-equivalence band",
]
timeout_penalty_seconds = 10

[reporting]
minimum_claim = "Report exact solver versions, binary hashes, corpus construction, validation outcome, timeouts, and raw artifact hash."
forbidden_claims = [
  "Rust beats Z3 in general",
  "Rust beats a state-of-the-art SAT portfolio",
  "Rust is a state-of-the-art SMT solver",
  "a random-family win transfers to industrial or theory formulas",
]

