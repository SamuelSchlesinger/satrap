id = "2026-07-23-sampled-nonregular-retention"
owner = "Codex"
status = "complete; performance-rejected; Seed35 proof verified"
worktree_revision = "uncommitted worktree after dense macro BVA"
preregistration_sha256 = "03fcce2098da238a97a7012f2f1670b70f6c1001b0ae45fbd57c84290d070a88"
