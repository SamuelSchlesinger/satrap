[boundary]
training_derived = true
statement = "The REGN and SAT Competition development corpora have already been revealed by earlier experiments. They may falsify this mechanism and qualify it for a later untouched gate, but they cannot establish generalization, priority, or a state-of-the-art claim."
heldout_use = "none"
default_promotion = "not authorized from this experiment"

[hypothesis]
mechanism = "Each first-UIP conflict-resolution chain is regular, but clauses reused as parents connect those chains into a resolution DAG that may resolve the same pivot more than once along an ancestry path. On formulas separating general from regular resolution, a learned clause carrying an exact sampled witness of such a nonregular derivation may encode proof reuse that length and recent-use counts cannot see. Giving that clause priority among otherwise deletable zero-use clauses may preserve the useful general-resolution structure."
prediction = "The sampled-witness treatment will exercise true repeated-pivot ancestry, alter at least one fixed-quota deletion set, retain the promoted solver's 5/8 development and 1/6 no-factor REGN coverage, and retain dense macro BVA's 5/6 REGN coverage. It qualifies only if it also adds a REGN solve or improves the repeated pooled median of jointly solved macro-REGN cases by at least five percent without violating the frozen regression and correctness ceilings."
falsification = "Reject the frozen treatment as a performance candidate if no exact sampled repeated-pivot witness occurs; no deletion set changes; development, no-factor REGN, or macro-REGN coverage falls; it neither adds a macro-REGN solve nor improves the qualifying macro pooled median by five percent; any selected macro case regresses more than twenty-five percent; any repeated development case regresses more than twenty percent; easy overhead exceeds ten percent; or any model, proof, determinism, metadata, disabled-equivalence, or differential check fails. Do not tune sample size, hash, propagation rule, comparator direction, schedule, quota, or thresholds after observing results."

[prior_art]
regn = "Li et al., Simplified and Randomized Formula REGN, Proceedings of SAT Competition 2024, pages 44-45, https://helda.helsinki.fi/server/api/core/bitstreams/3f1f286b-3def-49e9-98ba-f887b1bc250e/content"
first_uip_regularity = "Gurfinkel and Rollini et al., Labelled Interpolation Systems for Hyper-Resolution, Clausal, and Local Proofs, 2018, https://pmc.ncbi.nlm.nih.gov/articles/PMC6109788/"
proof_regularization = "Bar-Ilan et al., Reducing the Size of Resolution Proofs in Linear Time, STTT 2011, https://ofers.dds.technion.ac.il/publications/sttt10.pdf"
improved_pivot_recycling = "Gupta, Ganai, and Wang, Improved Single Pass Algorithms for Resolution Proof Reduction, ATVA 2012, https://www.cse.iitb.ac.in/~akg/papers/resProof-atva12.pdf"
proof_analysis = "Kokkala and Nordstrom, Using Resolution Proofs to Analyse CDCL Solvers, CP 2020, https://jakobnordstrom.se/docs/publications/UsingProofs_CP.pdf"
clause_management = "Cai, Zhang, Shi, Tao, and Xu, Rethinking Clause Management for CDCL SAT Solvers, arXiv:2602.20829v2, https://arxiv.org/pdf/2602.20829"
recent_collision_exclusions = "Dual Implication Points dynamically introduce extensions from conflict implication graphs, and CaDiCaL-FX factors learned and original clauses into XOR, ITE, and OR gates. Neither direction is claimed here."
established = "Regular versus general resolution, first-UIP learning, proof ancestry, repeated-pivot proof regularization, proof trimming, clause length, LBD, activity, and dynamic BCP/analysis usage are established."
distinction = "The treatment does not rewrite or compress a completed proof, predict final-core membership offline, introduce extension variables, factor clauses, or rename clause length as lineage. During live search it propagates a bounded exact sample of pivot variables through learned-clause parents, records only sound repeated-pivot witnesses, and uses the inherited witness as a new deletion tie-breaker under the published usage policy's unchanged schedule and quota."
novelty_status = "Provisional candidate contribution. A targeted primary-source and source-oriented search found no prior use of sampled transitive resolution-pivot ancestry as an online learned-clause retention signal. This is not a proof of novelty or priority, and no such claim is authorized without a broader scholarly review and successful untouched evaluation."

[policy]
name = "sampled nonregular-derivation retention"
flag = "--nonregular-retention"
disable_flag = "--no-nonregular-retention"
default = "disabled"
requires = "the promoted LBD-free clause-management policy"
sample_capacity = 4
sample_semantics = "For each clause, retain the four distinct pivot variable IDs with smallest deterministic ranks among the subset of first-UIP resolution pivots represented by its tracked ancestry. The sample is exact: membership has no false positives, while omitted pivots can cause false negatives."
rank = "Rank variable v by SplitMix64(v): add 0x9e3779b97f4a7c15; xor-shift 30 and multiply by 0xbf58476d1ce4e5b9; xor-shift 27 and multiply by 0x94d049bb133111eb; xor-shift 31. Break rank ties by raw variable ID."
storage = "Only when enabled, allocate a [u32;4] sample and one u8 state entry aligned with every long and binary ClauseRef. State stores sample count zero through four plus an inherited nonregular bit. Original clauses start empty and regular. Learned binaries remain deletion-permanent but carry metadata because they can be proof parents. Do not expand Clause, binary literals, Watch, or reason records."
analysis = "Initialize the accumulator from the conflict clause. For every non-UIP resolution pivot p and its reason R, first inherit R's nonregular bit. Before inserting p, set the bit if p occurs in either the accumulated sample or R's sample. Merge R's bottom-four sample into the accumulator, insert p, and retain the bottom four by the frozen rank. Attach the accumulator to the final learned non-unit clause after minimization. Learned units retain no metadata because they are enqueued without a clause reason."
soundness_scope = "Recursive and optional binary learned-clause minimization may add resolution steps after the tracked first-UIP chain. Omitting those extra pivots can only miss witnesses: every retained sampled pivot and every reported repeat still belongs to the learned clause's derivation ancestry."
inheritance = "Once a clause has a sampled repeated-pivot witness, every learned descendant that uses it as a first-UIP parent inherits the nonregular bit."
quota = "Compute locks, positive-score protections, the unlocked zero-score candidate pool, the one-indexed reduction number, and floor((0.90-0.40/log10(r+9))*pool_size) deletion count exactly as the promoted LBD-free reducer."
ordering = "Within the zero-score pool, delete regular clauses before witnessed-nonregular clauses. Within each class use the promoted length-descending, ClauseRef-ascending order. Delete exactly the frozen quota. When all witness bits are false, the complete deletion order and set are identical to the promoted policy."
diagnostics = "Report tracked resolution pivots, exact sampled repeat events, learned non-unit clauses born or inherited nonregular, nonregular zero-score candidates, deletion-set displacements relative to the promoted comparator at the same state, witnessed clauses rescued, witnessed clauses deleted after the regular pool is exhausted, and logical metadata bytes."
everything_else = "Keep score initialization, BCP and analysis increments, 2048-conflict decay, first reduction at conflict 1000, square-root reduction intervals, deletion fractions, branching, restarts, chronological backtracking, phase saving, proof logging, model reconstruction, minimization, propagation, preprocessing, and all unrelated defaults unchanged."

