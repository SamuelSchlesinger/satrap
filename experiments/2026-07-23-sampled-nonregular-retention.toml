secondary_metrics = [
  "no-factor REGN and development solved counts",
  "per-instance medians",
  "decisions, propagations, conflicts, restarts, learned literals, reductions, and deletions",
  "tracked pivots, sampled repeats, inherited nonregular clauses, zero-score witness candidates, deletion displacements, rescues, witnessed deletions, and metadata bytes",
  "easy pooled overhead",
]
stopping_rule = "Implement the frozen mechanism once, complete unit and differential checks, freeze the binary, and execute all declared comparisons. Do not consume the existing heldout manifest or retune any treatment detail from these results."

[correctness]
unit = "Test SplitMix rank constants; bottom-four ordering, deduplication, merge, and truncation; exact repeat detection; witness inheritance; empty original metadata; learned binary parent propagation; optional storage; fixed deletion quota; regular-first ordering; lock and positive-score protection; witnessed displacement; witnessed deletion when the regular pool is exhausted; and all-regular exact equivalence."
differential = "Extend the deterministic 2000-formula brute-force suite to --nonregular-retention and supported combinations, requiring exact SAT/UNSAT agreement and original-formula model validation."
models = "Independently validate every SAT model emitted in all benchmark passes."
proof = "Emit a treatment DRAT proof for a real solved REGN instance and require independent DRAT-trim verification against the original CNF."
disabled_equivalence = "The modified binary with --no-nonregular-retention must reproduce the frozen promoted deterministic trajectory and all existing counters on 6s268."
determinism = "Repeated treatment executions must have identical result, search counters, and regularity counters after excluding solve_seconds."
metadata = "Enabled sample/state arrays must remain aligned with stable long and binary ClauseRefs through allocation, lazy deletion, preprocessing, and optional compaction; they must remain empty when disabled."
exercise = "Require nonzero tracked pivots, at least one exact sampled repeat, at least one witnessed learned clause, at least one witnessed zero-score candidate, and at least one deletion-set displacement."

