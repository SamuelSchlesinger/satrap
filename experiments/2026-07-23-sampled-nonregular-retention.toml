summary = "The frozen treatment found a real, deterministic family-specific gain but failed the unconditional performance gate. With dense macro BVA it solved all 6/6 REGN cases at five seconds versus 5/6 for the frozen macro control, adding K4-L2-Seed35 at a 3.273549-second median. It simultaneously fell from 1/6 to 0/6 without factoring and from 5/8 to 4/8 on the development screen. On repeated jointly solved cases, K4-L2-Seed20 regressed 27.544 percent and gm24 regressed 29.425 percent, exceeding the frozen 25 and 20 percent ceilings. Easy pooled time improved 0.979 percent. The signal is therefore mixed and strongly conditional on formula structure; it is not authorized for default promotion, held-out evaluation, a novelty claim, or a claim that Seed35 was globally previously unsolved."
conclusion = "Reject the unchanged policy as a general performance candidate and retain it disabled behind --nonregular-retention as a diagnostic, proof-capable research result. The exact sampled ancestry signal is exercised and changes fixed-quota deletion sets, but preserving every witnessed clause is not robust across the revealed families. Do not tune sample size, rank, inheritance, comparator, quota, or activation on these results."

