[protocol]
full_slice_timeout_seconds = 2
full_slice_repetitions = 1
jointly_solved_repetitions = 7
jointly_solved_selection = "After the frozen full-slice run, repeat every development instance that either variant solves and whose control or treatment wall time is at least 0.1 seconds. Apply the per-instance ceiling to every selected case and pool the sum of their per-instance medians."
endpoint_instances = ["Break_12_50.xml.cnf", "6s268r_Iter94.cnf"]
endpoint_timeout_seconds = 25
endpoint_repetitions = 3
easy_overhead_repetitions = 11
memory_instance = "6s268r_Iter94.cnf"
memory_repetitions = 3
memory_measurement = "/usr/bin/time -l maximum resident set size around --no-model runs; compare medians on an otherwise idle host"
threads = 1
order_seed = 20251103
primary_metric = "validated solved count on the frozen eight-instance development slice at two seconds"
secondary_metrics = [
  "exact logical bytes in long metadata/arena, binary literals/activity/flags, and per-variable reasons",
  "repeated maximum resident set size",
  "deterministic decisions, propagations, conflicts, restarts, learned clauses/literals, deletions, reductions, and binary watch visits",
  "paired wall time",
]
stopping_rule = "Implement the frozen representation once, run correctness and exact-trajectory checks, then execute the declared development comparisons. Do not inspect held-out data or combine this change with variable-width watches, direct-literal binary reasons, eager binary deletion, binary deduplication, or a heuristic change."

[correctness]
layout_tests = "Assert ClauseRef round trips both storage classes, Option<ClauseRef> is four bytes, binary arrays remain aligned in length, Watch remains eight bytes, and long arena allocation excludes binary literals."
differential = "Run the existing deterministic brute-force differential suite across all feature configurations and validate emitted SAT models against the original clauses."
optional_features = "Retain focused tests for probing, vivification, subsumption/SSR, bounded variable elimination, binary learned-clause minimization, database reduction, and arena compaction."
trajectory = "On every completed frozen control/treatment pair, compare all deterministic search counters. Any mismatch rejects the representation regardless of runtime."
proof = "Emit default control and treatment proofs for 6s268r_Iter94, require byte-identical SHA-256, and verify the treatment proof independently with DRAT-trim."

[promotion_gate]
development_solved_delta_minimum = 0
deterministic_counter_mismatches_maximum = 0
proof_bytes_must_match = true
performance_alternative = "Either the pooled triggered repeated median improves by at least 2 percent or the repeated median maximum resident set size on 6s268 improves by at least 10 percent."
triggered_pooled_improvement_percent_minimum = 2
memory_improvement_percent_minimum = 10
jointly_solved_max_regression_percent = 5
endpoint_max_regression_percent = 5
easy_overhead_max_percent = 5
sat_model_validation_required = true
proof_validation_required = true
next_step = "If promoted, document the new internal representation and separately preregister variable-width 32-bit watches or direct-literal binary reasons. If rejected, restore the control representation and move to pressure-aware reduction or another independent gap."

