[experiment]
id = "2026-07-23-separate-packed-binary-storage"
owner = "Codex"
status = "complete"
worktree_revision = "uncommitted initial worktree"
control_binary = "/private/tmp/sat-baselines-20260723/sat-before-separate-binary-storage"
control_binary_sha256 = "7c567511f43213362ea18b821f6db4ebbc33b84e003ebd53b4ff2d1d11d1827f"

[hypothesis]
mechanism = "Binary clauses need neither variable-length arena metadata nor a long-clause literal slice. Moving their two literals, activity, and flags into separate compact arrays reduces cache footprint while a tagged 32-bit stable reference shrinks every per-variable reason. Keeping the existing packed watch order and binary fast path should preserve the deterministic CDCL trajectory."
prediction = "The treatment will preserve validated two-second solved count, deterministic search counters, and a byte-identical verified proof; it will also either improve the pooled repeated median of nontrivial jointly solved development cases by at least two percent or reduce repeated peak resident memory on 6s268 by at least ten percent, without a greater-than-five-percent runtime regression on any selected case, hard endpoint, or pooled easy set."
falsification = "Reject the representation unchanged if any result, model, proof byte, or deterministic search counter changes; development solved count falls; neither the runtime nor memory alternative succeeds; any selected or endpoint median regresses by more than five percent; or easy pooled overhead exceeds five percent. Do not change packing, reference tagging, or the promotion thresholds after observing treatment results."

[prior_art]
checked = [
  "Kissat 4.0.4 8af8e56f174b778aef3aa45af9f739b2a5f492c2 src/watch.h, src/assign.h, and src/analyze.c",
  "CaDiCaL 3.0.1 c60730422e758ef1cebe7aeddf2dda31c996bf04 src/clause.hpp, src/var.hpp, and src/analyze.cpp",
]
established = "Kissat stores a binary clause directly as a tagged other literal in each watch list and tags assignment reasons as binary literals, while large clauses use arena references. CaDiCaL instead keeps binary and large clauses as inline variable-sized Clause objects referenced by pointers. Specialized binary representation and compact tagged reasons are established implementation techniques."
distinction = "This intermediate Rust design retains the existing uniform 8-byte packed watches and stable binary clause identity so lazy deletion, optional simplifiers, and textual proof behavior stay simple. It separates binary literals, activity, and learned/deleted flags into parallel arrays; long-clause metadata and the literal arena then contain only clauses of length at least three."
novelty_status = "Baseline engineering only. No novelty claim."

[policy]
clause_reference = "Replace usize clause references with a NonZeroU32-backed tagged reference. The high packed bit selects binary versus long storage and the lower 31 bits select an index; reserving one packed value makes Option<ClauseRef> four bytes. Each storage class is capped below 2^31 entries."
binary_literals = "Store exactly two packed Lit values per binary clause in Vec<[Lit; 2]>. Preserve allocation order within the binary class."
binary_activity = "Store one f64 activity per binary clause and apply the same learned-clause bumps and global rescaling as the control, even though binary clauses are permanent under database reduction."
binary_flags = "Store learned and deleted bits in one parallel u8 per binary clause. Original simplifiers may lazily delete binaries; learned binaries remain permanent exactly as in the control."
long_storage = "Store only clauses of length at least three in Vec<Clause> and clause_arena. Preserve relative long-clause allocation order, literal order, watch order, reduction ordering, and stable references."
watches = "Keep the existing 8-byte packed Watch and in-place scan. Its upper 32 bits contain the packed tagged ClauseRef, its lower 32 bits the blocker. Derive the binary fast-path tag from the reference rather than storing a separate constructor argument."
reasons = "Keep Option<ClauseRef> semantics, but exploit NonZeroU32 so each per-variable reason occupies four bytes instead of the control's Option<usize>. Conflict analysis still resolves through the referenced two-literal record, preserving binary learned-clause activity behavior."
preprocessing = "Adapt vivification, subsumption/SSR, bounded variable elimination, arena collection, deletion, and binary-resolution minimization to dispatch through tagged references. Do not alter any schedule, effort bound, clause order within a storage class, or default feature setting."
proof = "No proof rule changes. With every non-layout policy frozen and watch order preserved, the default UNSAT proof is expected to be byte-identical to the control."
default = "Treatment becomes the sole internal representation only if the gate passes; the exact pre-change native binary is retained as the control artifact."

[variants]
