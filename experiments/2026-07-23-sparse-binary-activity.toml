summary = "The sparse activity mapping preserved the intermediate solver's exact deterministic trajectories and byte-identical verified 6s268 proof. Against the original legacy representation, the combined packed design tied 3/8 validated two-second solves, passed every five-percent runtime ceiling, removed 3440708 more logical binary-storage bytes than the intermediate, and reduced newly measured median peak RSS from 323043328 to 277856256 bytes: an exact 13.987929 percent improvement."
conclusion = "Promoted as the default representation. This is baseline engineering, not an algorithmic novelty claim. The next independent representation experiment may test variable-width watches, but must be separately preregistered and evaluated against this promoted baseline."

