treatment_proof = "/private/tmp/sat-baselines-20260723/variable-width-watch-6s268.drat"
proof_sha256 = "a787ce78cf16cde3e314ad9b490908a5cbf5271b8560506862489aa8f993ae64"
summary = "The stream preserved 3/8 validated two-second solves, every inspected deterministic counter, every optional-feature test, and the byte-identical independently verified 6s268 proof. It removed 6994936 logical watch bytes and improved newly repeated median RSS by 3.774253 percent. However, deriving each binary blocker through the stable clause index added an indirection and failed all four nontrivial runtime ceilings: regressions ranged from 7.945005 to 12.572211 percent."
conclusion = "Rejected unchanged and restored to the promoted fixed 8-byte watch representation. The memory hypothesis was confirmed, but the indexed-blocker implementation traded 10 MiB of median RSS for a 9.57 percent increase in retired instructions and broad 8-13 percent runtime regressions. Do not reinterpret this as evidence against Kissat-style one-word direct-literal watches; those require a separate direct-literal reason design and a new preregistration."

